<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใบเช็คลิสต์เก็บเงิน - หอพัก K&G</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #0284c7; --bg: #f3f6f9; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); color: #334155; padding: 20px; }

        /* Control Panel */
        .control-card {
            background: white; padding: 15px 20px; border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            display: flex; gap: 15px; align-items: center; flex-wrap: wrap;
            margin-bottom: 20px; border: 1px solid #e2e8f0;
        }
        
        .filter-group {
            display: flex; align-items: center; gap: 8px; 
            background: #f8fafc; padding: 5px 15px; border-radius: 20px; border: 1px solid #cbd5e1;
        }
        .filter-select { border: none; background: transparent; font-weight: bold; color: #0f172a; outline: none; }

        .btn-print {
            background: var(--primary); color: white; border: none; padding: 6px 20px; 
            border-radius: 20px; font-weight: 600; transition: 0.2s;
        }
        .btn-print:hover { transform: translateY(-1px); background: #0369a1; }

        /* A4 Paper Style */
        .a4-page {
            background: white; width: 210mm; min-height: 297mm; 
            margin: 0 auto; padding: 10mm; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px; position: relative; page-break-after: always;
        }

        /* Table Style */
        .check-table { width: 100%; border-collapse: collapse; font-size: 11pt; }
        .check-table th { 
            background-color: #f1f5f9; border: 1px solid #94a3b8; 
            padding: 5px; text-align: center; font-weight: 700; color: #334155;
        }
        .check-table td { border: 1px solid #cbd5e1; padding: 4px 6px; vertical-align: middle; }
        
        .room-col { font-weight: 800; text-align: center; font-size: 12pt; }
        .num-col { text-align: right; }
        .total-col { font-weight: 800; text-align: right; background-color: #f8fafc; }
        .chk-col { text-align: center; color: #cbd5e1; font-size: 10px; }
        .chk-box { width: 12px; height: 12px; border: 1px solid #94a3b8; display: inline-block; margin-right: 3px; }

        /* Print Settings */
        @media print {
            body { background: white; padding: 0; }
            .control-card, #loadingMsg { display: none !important; }
            .a4-page { box-shadow: none; margin: 0; width: 100%; border: none; }
            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="control-card">
        <h5 class="m-0 fw-bold text-primary me-3"><i class="fas fa-clipboard-list"></i> ใบเช็คลิสต์เก็บเงิน</h5>
        
        <div class="filter-group">
            <span class="small fw-bold text-muted">เดือน:</span>
            <input type="month" id="monthSelector" class="filter-select" onchange="loadData()">
        </div>

        <div class="filter-group">
            <span class="small fw-bold text-muted">โซน:</span>
            <select id="zoneSelector" class="filter-select" onchange="renderChecklist()">
                <option value="ALL">ทั้งหมด</option>
                <option value="A">A</option><option value="B">B</option><option value="C">C</option>
                <option value="D">D</option><option value="E">E</option><option value="F">F</option>
                <option value="G">G</option><option value="H">H</option><option value="I">I</option>
                <option value="J">J</option><option value="K">K</option><option value="L">L</option>
                <option value="M">M</option><option value="N">N</option><option value="O">O</option><option value="P">P</option>
                <option value="OTHERS" class="text-primary fw-bold">อื่นๆ (ส่วนกลาง)</option>
            </select>
        </div>

        <button class="btn-print ms-auto" onclick="window.print()">
            <i class="fas fa-print"></i> พิมพ์
        </button>
        <a href="index.html" class="btn btn-light border rounded-pill ms-2 fw-bold" style="font-size:13px;">กลับ</a>
    </div>

    <div id="loadingMsg" class="text-center mt-5" style="display:none;">
        <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
        <p class="mt-2 text-muted">กำลังโหลดข้อมูล...</p>
    </div>

    <div id="printArea"></div>

<script>
    // 🔥 LINK UPDATED: หอพัก v.2
    const API_URL = "https://script.google.com/macros/s/AKfycbwcFtw8FN2Zu3dte6adaFeigGpErvee8rOGYf1oZMLjMruxHdmqI2rkDVy87GH6tqs/exec"; 
    
    let currentData = [];
    const monthNames = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
    const ZONES = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P'];

    window.onload = function() {
        const now = new Date();
        document.getElementById('monthSelector').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        loadData();
    };

    function loadData() {
        const k = document.getElementById('monthSelector').value;
        document.getElementById('loadingMsg').style.display = 'block';
        document.getElementById('printArea').innerHTML = '';

        fetch(API_URL+"?action=load&key="+k)
        .then(r=>r.json())
        .then(res=>{ 
            document.getElementById('loadingMsg').style.display = 'none';
            if(res.status==="success" && res.data) {
                const d = JSON.parse(res.data);
                currentData = Array.isArray(d) ? d : d.rooms||[];
                renderChecklist();
            } else { 
                currentData=[]; 
                document.getElementById('printArea').innerHTML = '<div class="text-center text-muted mt-5">ไม่พบข้อมูล (กรุณากด "บันทึก" ที่หน้าจดมิเตอร์ก่อน)</div>';
            }
        })
        .catch(()=>{ 
            document.getElementById('loadingMsg').style.display = 'none'; 
            alert("โหลดข้อมูลไม่ได้ (Offline)");
        });
    }

    function renderChecklist() {
        const container = document.getElementById('printArea');
        container.innerHTML = '';
        
        const zone = document.getElementById('zoneSelector').value;
        const mKey = document.getElementById('monthSelector').value;
        const [y,m] = mKey.split('-').map(Number);
        const headerStr = `ประจำเดือน: ${monthNames[m-1]} ${y+543}`;

        // Filter Logic
        let rooms = [];
        if (zone === 'ALL') {
            rooms = currentData;
        } else if (zone === 'OTHERS') {
            // Filter ส่วนกลาง (ที่ไม่ใช่ A-P)
            rooms = currentData.filter(r => {
                const isStandardZone = ZONES.some(z => r.id.startsWith(z) && !isNaN(parseInt(r.id.substring(z.length))));
                return !isStandardZone;
            });
        } else {
            rooms = currentData.filter(r => r.id.startsWith(zone) && !isNaN(parseInt(r.id.substring(zone.length))));
        }

        if(rooms.length === 0 && currentData.length > 0) {
            container.innerHTML = '<div class="text-center text-muted mt-5">ไม่พบข้อมูลในโซนนี้</div>';
            return;
        }

        // Split into pages (25 rows per page)
        const ROWS_PER_PAGE = 25;
        for (let i = 0; i < rooms.length; i += ROWS_PER_PAGE) {
            const chunk = rooms.slice(i, i + ROWS_PER_PAGE);
            
            let html = `
            <div class="a4-page">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold m-0">📋 ใบเช็คลิสต์เก็บเงิน (K&G)</h4>
                    <div class="text-end">
                        <div class="fw-bold">${headerStr}</div>
                        <div class="small text-muted">โซน: ${zone === 'ALL' ? 'ทั้งหมด' : (zone==='OTHERS'?'ส่วนกลาง':zone)}</div>
                    </div>
                </div>

                <table class="check-table">
                    <thead>
                        <tr>
                            <th style="width:10%;">ห้อง</th>
                            <th style="width:15%;">ค่าเช่า+ส่วนกลาง</th>
                            <th style="width:15%;">ค่าน้ำ</th>
                            <th style="width:15%;">ค่าไฟ</th>
                            <th style="width:10%;">อื่นๆ/หนี้</th>
                            <th style="width:15%;">รวมสุทธิ</th>
                            <th style="width:10%;">สถานะ</th>
                            <th style="width:10%;">หมายเหตุ</th>
                        </tr>
                    </thead>
                    <tbody>`;

            chunk.forEach(r => {
                // Calculation Logic
                const wn=parseFloat(r.w_new)||0, wo=parseFloat(r.w_old)||0, wr=parseFloat(r.w_rate)||0;
                let wt=0; 
                if(r.w_new && wn>=wo){ 
                    let d=wn-wo; 
                    let chargeUnits = (!r.isCommon && d<4) ? 4 : d; // Min 4 for rooms
                    wt = chargeUnits * wr;
                }

                const en=parseFloat(r.e_new)||0, eo=parseFloat(r.e_old)||0, er=parseFloat(r.e_rate)||0;
                let et=0; 
                if(r.e_new && en>=eo){ let d=en-eo; et=d*er; }

                const rent = (parseFloat(r.rent)||0) + (parseFloat(r.custom)||0) + (parseFloat(r.internet)||0);
                const extra = parseFloat(r.extra)||0;
                const total = rent + wt + et + extra;

                html += `
                <tr>
                    <td class="room-col">${r.id}</td>
                    <td class="num-col" contenteditable="true">${rent.toLocaleString()}</td>
                    <td class="num-col small" contenteditable="true">${wt.toLocaleString()}</td>
                    <td class="num-col small" contenteditable="true">${et.toLocaleString()}</td>
                    <td class="num-col text-danger" contenteditable="true">${extra!=0 ? extra.toLocaleString() : '-'}</td>
                    <td class="total-col" contenteditable="true">${total.toLocaleString()}</td>
                    <td class="chk-col">
                        <span class="chk-box"></span>สด<br>
                        <span class="chk-box"></span>โอน
                    </td>
                    <td contenteditable="true"></td>
                </tr>`;
            });

            html += `
                    </tbody>
                </table>
                <div class="position-absolute bottom-0 end-0 p-4 small text-muted">
                    ผู้ตรวจสอบ ........................................ วันที่ ....................... (หน้า ${Math.floor(i/ROWS_PER_PAGE)+1})
                </div>
            </div>`;

            container.insertAdjacentHTML('beforeend', html);
        }
    }
</script>
</body>
</html>
