        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); padding: 20px; padding-bottom: 80px; }
        
        .table-responsive { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-height: 75vh; }
        .table-excel { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        .table-excel th { position: sticky; top: 0; background: #f1f5f9; color: #475569; padding: 10px; font-weight: 700; border-bottom: 2px solid #e2e8f0; z-index: 10; text-align: center; white-space: nowrap; }
        .table-excel td { border-bottom: 1px solid #f1f5f9; padding: 0; height: 40px; vertical-align: middle; }
        
        .cell-input { width: 100%; height: 100%; border: none; padding: 0 8px; outline: none; background: transparent; transition: 0.2s; font-family: 'Sarabun'; font-size: 13px; }
        .cell-input:focus { background: #e0f2fe; box-shadow: inset 0 0 0 2px var(--primary); }
        .cell-select { width: 100%; height: 100%; border: none; outline: none; background: transparent; padding: 0 5px; cursor: pointer; font-size: 12px; font-weight: 600; }
        
        .col-id { background: #f8fafc; font-weight: 800; text-align: center; width: 60px; color: #334155; }
        .col-status-active { color: #166534; background: #dcfce7; }
        .col-status-empty { color: #94a3b8; background: #f8fafc; }
        .col-status-moving { color: #854d0e; background: #fef9c3; }
        .col-status-debt { color: #991b1b; background: #fee2e2; }

        .zone-bar { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; }
        .btn-zone { border: 1px solid #cbd5e1; background: white; color: #64748b; border-radius: 20px; padding: 4px 15px; font-weight: 700; font-size: 12px; white-space: nowrap; }
        .btn-zone.active { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-all { border: 2px solid #0f172a; color: #0f172a; }
        .btn-all.active { background: #0f172a; color: white; }

        .status-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 10px 25px; border-radius: 50px; font-size: 13px; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

    let tenants = [], currentZone = 'ALL';

    window.onload = function() {
        renderZoneButtons();
        // Load cloud first, if empty -> use UPDATED_TENANTS
        loadData();
    };

    function loadData() {
        updateStatus("กำลังโหลด...", true);
        fetch(API_URL + "?action=loadTenants").then(r=>r.json()).then(res => {
            if(res.status==="success" && res.tenants && res.tenants.length > 0) {
                // Merge cloud data
                tenants = generateStructure(res.tenants);
            } else {
                // Use Hardcoded data if cloud empty
                tenants = generateStructure(UPDATED_TENANTS);
            }
            renderTable();
            updateStatus("ข้อมูลล่าสุด");
        }).catch(() => {
            tenants = generateStructure(UPDATED_TENANTS);
            renderTable();
            updateStatus("โหลด Local");
        });
    }

    function generateStructure(loadedData) {
        let newData = [];
        ZONES.forEach(z => {
            for(let i=1; i<=ROOMS_PER_ZONE; i++) {
                let id = z+i;
                // Find in loaded data (or hardcoded)
                let found = loadedData.find(t => t.id === id);
                if(found) {
                    newData.push(found);
                } else {
                    newData.push({
                        id: id, name: '', phone: '', deposit: '', 
                        contract_start: '', contract_end: '', status: 'Empty', debt: 0, note: ''
                    });
                }
            }
        });
        // Normalize Status
        newData.forEach(t => {
            if(!t.status) {
                t.status = (t.name && t.name.trim() !== '') ? 'Active' : 'Empty';
            }
        });
        return newData;
    }

    function renderZoneButtons() {
        const bar = document.getElementById('zoneBar');
        bar.innerHTML = `<button class="btn-zone btn-all active" onclick="filterZone('ALL')">ทั้งหมด</button>`;
        ZONES.forEach(z => {
            bar.innerHTML += `<button class="btn-zone" onclick="filterZone('${z}')">${z}</button>`;
        });
    }

    function filterZone(z) {
        currentZone = z;
        document.querySelectorAll('.btn-zone').forEach(b => b.classList.toggle('active', b.innerText === (z==='ALL'?'ทั้งหมด':z)));
        renderTable();
    }

    function renderTable() {
        const tb = document.getElementById('tableBody'); tb.innerHTML = '';

            // Let's show rooms that have NAMES or STATUS other than Empty to be cleaner?
            // Or just A1-A10 etc based on your list.
            // Simple: Show all 320 rooms? Too long.
            // Better: Show only rooms that have names or non-empty status
            displayList = tenants.filter(t => t.status !== 'Empty' || (t.name && t.name.trim() !== ''));
            // But user might want to add new tenant to empty room.
            // So let's show ALL for now, or revert to Whitelist logic if you prefer.
            // Let's use Whitelist logic from previous request as it's cleaner.
             const REAL_ROOMS_WHITELIST = [
                "A1","A2","A3","A4","A5","A6","A7","A8","A9","A10",
                "B1","B2","B3","B4","B5","B6","B7","B8","B9","B10",
                "C1","C2","C3","C4","C5","C6","C7","C8","C9","C10",
                "D1","D2","D3","D4","D5","D6","D7","D8","D9","D10",
                "E1","E2","E3","E4","E5","E6","E7","E8","E9","E10",
                "F1","F2","F3","F4","F5","F6","F7","F8","F9","F10",
                "G1","G2","G3","G4","G5","G6","G7","G8","G9","G10",
                "H1","H2","H3","H4","H5","H6","H7","H8","H9","H10",
                "I1","I2","I3","I4","I5","I6","I7","I8","I9",
                "J1","J2","J3","J4","J5","J6","J7","J8","J9","J10",
                "K1","K2","K3","K4","K5",
                "L1","L2","L3","L4","L5","L6","L7","L8","L9","L10",
                "M1","M2",
                "N1","N2","N3","N4","N5","N6","N7","N8","N9","N10"
            ];
            displayList = tenants.filter(t => REAL_ROOMS_WHITELIST.includes(t.id));
        }

        displayList.forEach(t => {
            let idx = tenants.indexOf(t); 
            
            let statusClass = 'col-status-empty';
            if(t.status === 'Active') statusClass = 'col-status-active';
            else if(t.status === 'MovingOut') statusClass = 'col-status-moving';
            else if(t.status === 'Debt') statusClass = 'col-status-debt';

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-id">${t.id}</td>
                <td class="${statusClass}">
                    <select class="cell-select nav-item" data-idx="${idx}" data-field="status" onchange="updateStatusColor(this)">
                        <option value="Active" ${t.status==='Active'?'selected':''}>🟢 อยู่ (Active)</option>
                        <option value="Empty" ${t.status==='Empty'?'selected':''}>⚪ ว่าง (Empty)</option>
                        <option value="MovingOut" ${t.status==='MovingOut'?'selected':''}>🟡 ย้าย (Moving)</option>
                        <option value="Debt" ${t.status==='Debt'?'selected':''}>🔴 ค้าง (Debt)</option>
                    </select>
                </td>
                <td><input type="text" class="cell-input nav-item" data-idx="${idx}" data-field="name" value="${t.name}"></td>
                <td><input type="text" class="cell-input nav-item" data-idx="${idx}" data-field="phone" value="${t.phone}"></td>
                <td><input type="number" class="cell-input nav-item" data-idx="${idx}" data-field="deposit" value="${t.deposit}"></td>
                <td><input type="date" class="cell-input nav-item" data-idx="${idx}" data-field="contract_start" value="${t.contract_start}"></td>
                <td><input type="date" class="cell-input nav-item" data-idx="${idx}" data-field="contract_end" value="${t.contract_end}"></td>
                <td><input type="number" class="cell-input nav-item text-danger fw-bold" data-idx="${idx}" data-field="debt" value="${t.debt}"></td>
                <td><input type="text" class="cell-input nav-item" data-idx="${idx}" data-field="note" value="${t.note}"></td>
            `;
            tb.appendChild(tr);
        });

        setupEvents();
    }

    function updateStatusColor(select) {
        let td = select.parentElement;
        td.className = ''; 
        if(select.value === 'Active') td.classList.add('col-status-active');
        else if(select.value === 'Empty') td.classList.add('col-status-empty');
        else if(select.value === 'MovingOut') td.classList.add('col-status-moving');
        else if(select.value === 'Debt') td.classList.add('col-status-debt');
        
        let idx = parseInt(select.dataset.idx);
        tenants[idx].status = select.value;
    }

    function setupEvents() {
        document.querySelectorAll('.nav-item').forEach(input => {
            input.onpaste = (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                const values = pasteData.split(/\r?\n/).filter(v => v.trim() !== '');
                const field = e.target.dataset.field;
                const allVisibleInputs = Array.from(document.querySelectorAll(`.nav-item[data-field="${field}"]`));
                const startPos = allVisibleInputs.indexOf(input);

                values.forEach((val, i) => {
                    if (startPos + i < allVisibleInputs.length) {
                        const targetInput = allVisibleInputs[startPos + i];
                        const targetIdx = parseInt(targetInput.dataset.idx);
                        
                        targetInput.value = val.trim();
                        tenants[targetIdx][field] = val.trim(); 

                        if(field === 'name' && val.trim() !== '') {
                            tenants[targetIdx].status = 'Active';
                            let sel = document.querySelector(`.nav-item[data-idx="${targetIdx}"][data-field="status"]`);
                            if(sel) { sel.value = 'Active'; updateStatusColor(sel); }
                        }
                    }
                });
            };

            input.oninput = (e) => {
                let idx = parseInt(e.target.dataset.idx);
                let field = e.target.dataset.field;
                tenants[idx][field] = e.target.value;
            };
            
            input.onkeydown = (e) => {
                if(e.key === 'ArrowDown' || e.key === 'Enter') {
                    e.preventDefault();
                    moveFocus(input, 1);
                } else if(e.key === 'ArrowUp') {
                    e.preventDefault();
                    moveFocus(input, -1);
                }
            };
        });
    }

    function moveFocus(currentInput, direction) {
        const field = currentInput.dataset.field;
        const allVisible = Array.from(document.querySelectorAll(`.nav-item[data-field="${field}"]`));
        const currPos = allVisible.indexOf(currentInput);
        if(currPos + direction >= 0 && currPos + direction < allVisible.length) {
            allVisible[currPos + direction].focus();
            if(allVisible[currPos + direction].select) allVisible[currPos + direction].select();
        }
    }

    function saveToCloud() {
        updateStatus("กำลังบันทึก...", true);
        fetch(API_URL + "?action=saveTenants", { 
            method: "POST", 
            body: JSON.stringify({ tenants: tenants, waiting: [] }) 
        })
        .then(r=>r.json()).then(res => { 
            if(res.status==="success") { alert("✅ บันทึกเรียบร้อย"); updateStatus("พร้อมใช้งาน"); }
            else alert("❌ Error: "+res.message);
        })
        .catch(() => updateStatus("❌ บันทึกไม่สำเร็จ", false));
    }

    function updateStatus(msg, loading=false) {
        const el = document.getElementById('statusMsg');
        el.innerHTML = loading ? `<i class="fas fa-spinner fa-spin text-warning"></i> ${msg}` : `<i class="fas fa-check-circle text-success"></i> ${msg}`;
    }
</script>
</body>
