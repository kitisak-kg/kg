<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกมิเตอร์ (Free Style) - หอพัก K&G</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #0284c7; --bg: #f8fafc; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); padding: 20px; padding-bottom: 100px; }
        
        .control-bar {
            background: white; padding: 15px; border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }

        /* Table Styling */
        .table-container { background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; max-height: 80vh; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1400px; }
        
        th { 
            position: sticky; top: 0; background: #f1f5f9; color: #475569; 
            padding: 5px; border-bottom: 2px solid #cbd5e1; border-right: 1px solid #e2e8f0;
            font-size: 13px; text-align: center; z-index: 10;
        }
        
        /* Editable Headers */
        .th-edit { background: #fff; border: 1px dashed #cbd5e1; color: #0f172a; cursor: text; padding: 5px; min-width: 80px; }
        .th-edit:focus { background: #e0f2fe; outline: 2px solid var(--primary); }

        .th-water { background: #e0f2fe; color: #0284c7; }
        .th-elec { background: #ffedd5; color: #c2410c; }

        td { border-bottom: 1px solid #f1f5f9; border-right: 1px solid #f1f5f9; padding: 0; height: 35px; }

        /* Input Styling */
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .cell-input {
            width: 100%; height: 100%; border: none; padding: 0 5px; 
            text-align: right; outline: none; font-family: 'Sarabun'; font-size: 13px;
            background: transparent; transition: 0.1s;
        }
        .cell-input:focus { background: #e0f2fe; box-shadow: inset 0 0 0 2px var(--primary); }
        
        .col-room input { text-align: left; font-weight: bold; color: #334155; background: #f8fafc; text-align: center; }
        .col-calc { background: #f8fafc; color: #64748b; font-weight: 600; pointer-events: none; }
        .col-money { font-weight: bold; color: #0f172a; }
        
        /* Zone Tabs */
        .zone-tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 10px; }
        .btn-zone {
            border: 1px solid #cbd5e1; background: white; color: #64748b; 
            border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: bold; 
            white-space: nowrap; cursor: pointer; transition: 0.2s;
        }
        .btn-zone:hover { background: #f1f5f9; }
        .btn-zone.active { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-all { border: 2px solid #0f172a; color: #0f172a; }
        .btn-all.active { background: #0f172a; color: white; }

        .btn-add-room { width: 100%; padding: 10px; border: 2px dashed #cbd5e1; background: #f8fafc; color: #64748b; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn-add-room:hover { background: #e2e8f0; color: #334155; border-color: #94a3b8; }

        .action-btn { cursor: pointer; opacity: 0.6; transition: 0.2s; border:none; background:none; padding: 0 5px; }
        .action-btn:hover { opacity: 1; transform: scale(1.2); }
        .btn-split { color: #f59e0b; }
        .btn-del { color: #ef4444; }

        .status-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 10px 25px; border-radius: 50px; font-size: 13px; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="container-fluid" style="max-width: 1800px;">
    
    <div class="control-bar">
        <div class="d-flex align-items-center gap-3">
            <h5 class="m-0 fw-bold text-primary"><i class="fas fa-edit"></i> บันทึกมิเตอร์ (Free Style)</h5>
            <div class="d-flex align-items-center bg-light px-3 py-1 rounded-pill border">
                <span class="small fw-bold text-muted me-2">เดือน:</span>
                <input type="month" id="monthPicker" style="border:none; background:transparent; font-weight:bold; color:#0284c7; outline:none;" onchange="loadData()">
            </div>
        </div>
        <div class="d-flex gap-2">
            <a href="index.html" class="btn btn-light border rounded-pill fw-bold">กลับเมนู</a>
            <button class="btn btn-success rounded-pill fw-bold px-4" onclick="saveToCloud()"><i class="fas fa-save"></i> บันทึก</button>
        </div>
    </div>

    <div class="zone-tabs" id="zoneTabs"></div>

    <div class="table-container">
        <table id="meterTable">
            <thead>
                <tr>
                    <th rowspan="2" style="width:70px;">จัดการ</th>
                    <th rowspan="2" style="width:70px;">ห้อง</th>
                    <th colspan="4" class="th-water">💧 ประปา (ขั้นต่ำ 4)</th>
                    <th colspan="4" class="th-elec">⚡ ไฟฟ้า</th>
                    
                    <th rowspan="2" style="width:80px;"><input type="text" class="cell-input th-edit fw-bold text-center" id="head_rent" value="ค่าเช่า" onchange="saveHeader()"></th>
                    <th rowspan="2" style="width:80px;"><input type="text" class="cell-input th-edit fw-bold text-center" id="head_custom" value="ส่วนกลาง" onchange="saveHeader()"></th>
                    <th rowspan="2" style="width:80px;"><input type="text" class="cell-input th-edit fw-bold text-center" id="head_net" value="เน็ต" onchange="saveHeader()"></th>
                    <th rowspan="2" style="width:100px;"><input type="text" class="cell-input th-edit fw-bold text-center text-danger" id="head_extra" value="อื่นๆ/หนี้" onchange="saveHeader()"></th>
                    
                    <th rowspan="2" style="width:90px;">รวมสุทธิ</th>
                </tr>
                <tr>
                    <th style="width:60px;">เก่า</th><th style="width:60px;">ใหม่</th><th style="width:40px;">Rate</th><th style="width:50px;">รวม</th>
                    <th style="width:60px;">เก่า</th><th style="width:60px;">ใหม่</th><th style="width:40px;">Rate</th><th style="width:50px;">รวม</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    
    <button class="btn-add-room" onclick="addNewRow()">+ เพิ่มห้องใหม่</button>

</div>

<div class="status-bar" id="statusMsg"><i class="fas fa-check-circle text-success"></i> พร้อมใช้งาน</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbytJyg1eNsBSj6c10DaBp8ESrihAh1ZhB__FUUMBAbCYKh2DE0mRqFjrbJcZf6ch-Q/exec"; 
    
    let currentData = [];
    let currentHeaders = { rent:'ค่าเช่า', custom:'ส่วนกลาง', net:'เน็ต', extra:'อื่นๆ/หนี้' }; // Default Headers
    let currentZone = 'ALL';
    
    const ZONES = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P'];
    const ROOMS_PER_ZONE = 20; 

    window.onload = function() {
        const now = new Date();
        document.getElementById('monthPicker').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        renderZoneTabs();
        loadData();
    };

    function loadData() {
        const k = document.getElementById('monthPicker').value;
        updateStatus("กำลังโหลด...", true);
        
        fetch(API_URL + "?action=load&key=" + k)
        .then(r => r.json())
        .then(res => {
            if(res.status==="success" && res.data) {
                const d = JSON.parse(res.data);
                currentData = Array.isArray(d) ? d : d.rooms||[];
                if(d.headers) currentHeaders = d.headers; // Load saved headers
            } else {
                createDefaultStructure();
            }
            applyHeaders();
            renderTable();
            updateStatus("ข้อมูลล่าสุด");
        })
        .catch(err => {
            createDefaultStructure();
            renderTable();
            updateStatus("โหลด Local (Error)");
        });
    }

    function createDefaultStructure() {
        currentData = [];
        ZONES.forEach(z => {
            for(let i=1; i<=ROOMS_PER_ZONE; i++) {
                currentData.push(createEmptyRow(z+i));
            }
        });
        // Common areas
        ["ปั้มบาดาล1","ปั้มบาดาล2","ปั้มส่งแท้ง+3","ตู้ซักผ้า","กล้องA","กล้องC","กล้องG","กล้องF","ของชํ่าป่ายาง"].forEach(c => {
            currentData.push(createEmptyRow(c, true));
        });
    }

    function createEmptyRow(id, isCommon=false) {
        // Set specific rents
        let rent = 3300; 
        if(id === 'B1') rent = 4000;
        else if(id === 'M1') rent = 0;
        else if(isCommon) rent = 0;

        return {
            id: id, w_old: '', w_new: '', w_rate: 30, e_old: '', e_new: '', e_rate: 8,
            rent: rent, custom: 0, internet: 0, extra: 0, isCommon: isCommon
        };
    }

    // --- Headers Logic ---
    function applyHeaders() {
        document.getElementById('head_rent').value = currentHeaders.rent || 'ค่าเช่า';
        document.getElementById('head_custom').value = currentHeaders.custom || 'ส่วนกลาง';
        document.getElementById('head_net').value = currentHeaders.net || 'เน็ต';
        document.getElementById('head_extra').value = currentHeaders.extra || 'อื่นๆ/หนี้';
    }

    function saveHeader() {
        currentHeaders.rent = document.getElementById('head_rent').value;
        currentHeaders.custom = document.getElementById('head_custom').value;
        currentHeaders.net = document.getElementById('head_net').value;
        currentHeaders.extra = document.getElementById('head_extra').value;
    }

    // --- Zone Logic ---
    function renderZoneTabs() {
        const bar = document.getElementById('zoneTabs');
        bar.innerHTML = `<button class="btn-zone btn-all active" onclick="filterZone('ALL')">ทั้งหมด</button>`;
        ZONES.forEach(z => {
            bar.innerHTML += `<button class="btn-zone" onclick="filterZone('${z}')">${z}</button>`;
        });
    }

    function filterZone(z) {
        currentZone = z;
        document.querySelectorAll('.btn-zone').forEach(b => b.classList.toggle('active', b.innerText === (z==='ALL'?'ทั้งหมด':z)));
        renderTable();
    }

    // --- Render Table ---
    function renderTable() {
        const tb = document.getElementById('tableBody');
        tb.innerHTML = '';

        // Filter Data based on Zone
        let displayData = [];
        if(currentZone === 'ALL') {
            displayData = currentData; // Show All
        } else {
            // Show only rooms starting with Zone letter (e.g., 'A')
            displayData = currentData.filter(r => r.id.startsWith(currentZone));
        }

        displayData.forEach(r => {
            // Find real index in main array to bind events correctly
            let realIdx = currentData.indexOf(r);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-center" style="white-space:nowrap;">
                    <button class="action-btn btn-split" onclick="splitRow(${realIdx})" title="แยกบิล">➗</button>
                    <button class="action-btn btn-del" onclick="deleteRow(${realIdx})" title="ลบ">🗑️</button>
                </td>
                <td class="col-room"><input type="text" class="cell-input nav-input fw-bold text-center" value="${r.id}" onchange="updateData(${realIdx}, 'id', this.value)"></td>
                
                <td><input type="number" class="cell-input nav-input" value="${r.w_old}" oninput="calc(${realIdx}, 'w', this.value, 'old')"></td>
                <td><input type="number" class="cell-input nav-input fw-bold" value="${r.w_new}" oninput="calc(${realIdx}, 'w', this.value, 'new')"></td>
                <td><input type="number" class="cell-input nav-input text-center text-muted" value="${r.w_rate}" oninput="calc(${realIdx}, 'w', this.value, 'rate')"></td>
                <td><input type="text" id="w_total_${realIdx}" class="cell-input col-calc text-primary" readonly value="0"></td>
                
                <td><input type="number" class="cell-input nav-input" value="${r.e_old}" oninput="calc(${realIdx}, 'e', this.value, 'old')"></td>
                <td><input type="number" class="cell-input nav-input fw-bold" value="${r.e_new}" oninput="calc(${realIdx}, 'e', this.value, 'new')"></td>
                <td><input type="number" class="cell-input nav-input text-center text-muted" value="${r.e_rate}" oninput="calc(${realIdx}, 'e', this.value, 'rate')"></td>
                <td><input type="text" id="e_total_${realIdx}" class="cell-input col-calc text-danger" readonly value="0"></td>
                
                <td><input type="number" class="cell-input nav-input col-money" value="${r.rent}" oninput="updateData(${realIdx}, 'rent', this.value)"></td>
                <td><input type="number" class="cell-input nav-input" value="${r.custom}" oninput="updateData(${realIdx}, 'custom', this.value)"></td>
                <td><input type="number" class="cell-input nav-input" value="${r.internet}" oninput="updateData(${realIdx}, 'internet', this.value)"></td>
                <td><input type="number" class="cell-input nav-input text-danger" value="${r.extra||0}" oninput="updateData(${realIdx}, 'extra', this.value)"></td>
                
                <td><input type="text" id="grand_total_${realIdx}" class="cell-input col-money text-success fw-bold text-end pe-2" readonly value="0"></td>
            `;
            tb.appendChild(tr);
            calculateRowUI(realIdx);
        });
        
        setupNavigation();
    }

    // --- Calculation ---
    function calc(idx, type, val, field) {
        if(field === 'old') currentData[idx][type+'_old'] = val;
        if(field === 'new') currentData[idx][type+'_new'] = val;
        if(field === 'rate') currentData[idx][type+'_rate'] = val;
        calculateRowUI(idx);
    }

    function updateData(idx, field, val) {
        currentData[idx][field] = val;
        calculateRowUI(idx);
    }

    function calculateRowUI(idx) {
        const r = currentData[idx];
        
        let wn = parseFloat(r.w_new) || 0;
        let wo = parseFloat(r.w_old) || 0;
        let wr = parseFloat(r.w_rate) || 0;
        let wTotal = 0;
        if(r.w_new && r.w_old) {
            let diff = Math.max(0, wn - wo);
            let units = (!r.isCommon && diff < 4) ? 4 : diff; 
            wTotal = units * wr;
        }
        let wElem = document.getElementById(`w_total_${idx}`);
        if(wElem) wElem.value = wTotal;

        let en = parseFloat(r.e_new) || 0;
        let eo = parseFloat(r.e_old) || 0;
        let er = parseFloat(r.e_rate) || 0;
        let eTotal = 0;
        if(r.e_new && r.e_old) {
            let diff = Math.max(0, en - eo);
            eTotal = diff * er;
        }
        let eElem = document.getElementById(`e_total_${idx}`);
        if(eElem) eElem.value = eTotal;

        let rent = parseFloat(r.rent) || 0;
        let cust = parseFloat(r.custom) || 0;
        let net = parseFloat(r.internet) || 0;
        let ext = parseFloat(r.extra) || 0;
        
        let grand = rent + cust + net + ext + wTotal + eTotal;
        let gElem = document.getElementById(`grand_total_${idx}`);
        if(gElem) gElem.value = grand.toLocaleString();
    }

    // --- Action Logic ---
    function splitRow(idx) {
        let original = currentData[idx];
        let newRow = JSON.parse(JSON.stringify(original));
        newRow.w_old = ''; newRow.w_new = '';
        newRow.e_old = ''; newRow.e_new = '';
        newRow.extra = 0; 
        currentData.splice(idx + 1, 0, newRow);
        renderTable();
    }

    function addNewRow() {
        currentData.push(createEmptyRow("New"));
        renderTable();
        // Scroll to bottom
        window.scrollTo(0, document.body.scrollHeight);
    }

    function deleteRow(idx) {
        if(confirm("ลบแถวนี้?")) {
            currentData.splice(idx, 1);
            renderTable();
        }
    }

    function setupNavigation() {
        const inputs = document.querySelectorAll('.nav-input');
        const gridWidth = 11; 

        inputs.forEach((input, i) => {
            input.onkeydown = (e) => {
                if(e.key.startsWith('Arrow')) {
                    // Simple nav logic (might be slightly off if rows filtered, but good enough for now)
                    // For perfect nav in filtered view, we'd need to map visual rows to inputs. 
                    // Keeping it simple: Standard Tab/Shift-Tab works natively too.
                }
            };
            // Paste logic same as before (omitted for brevity, assume standard paste works on input)
             input.onpaste = (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                const rows = pasteData.split(/\r?\n/).filter(v => v !== '');
                let startIdx = i; 
                rows.forEach((rowStr, rOffset) => {
                    const cols = rowStr.split('\t');
                    cols.forEach((val, cOffset) => {
                        let targetIdx = startIdx + (rOffset * gridWidth) + cOffset;
                        if(inputs[targetIdx]) {
                            inputs[targetIdx].value = val.trim();
                            inputs[targetIdx].dispatchEvent(new Event('input')); 
                            inputs[targetIdx].dispatchEvent(new Event('change')); 
                        }
                    });
                });
            };
        });
    }

    function saveToCloud() {
        updateStatus("กำลังบันทึก...", true);
        // Include headers in save data
        const saveData = {
            rooms: currentData,
            headers: currentHeaders
        };
        
        fetch(API_URL + "?action=save&key=" + document.getElementById('monthPicker').value, {
            method: "POST",
            body: JSON.stringify(saveData)
        })
        .then(r => r.json())
        .then(res => {
            if(res.status==="success") {
                updateStatus("บันทึกแล้ว " + new Date().toLocaleTimeString());
                alert("✅ บันทึกสำเร็จ!");
            } else { alert("Error: " + res.message); }
        })
        .catch(() => updateStatus("❌ บันทึกไม่สำเร็จ", false));
    }

    function updateStatus(msg, loading=false) {
        document.getElementById('statusMsg').innerHTML = loading ? `<i class="fas fa-spinner fa-spin text-warning"></i> ${msg}` : `<i class="fas fa-check-circle text-success"></i> ${msg}`;
    }
</script>
</body>
</html>
