<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จดมิเตอร์ (อิสระ) - หอพัก K&G</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #0284c7; --bg: #f8fafc; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); padding: 20px; padding-bottom: 100px; }
        
        .control-bar {
            background: white; padding: 15px; border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }

        /* Table Styling */
        .table-container { background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; max-height: 80vh; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1200px; }
        
        th { 
            position: sticky; top: 0; background: #f1f5f9; color: #475569; 
            padding: 8px; border-bottom: 2px solid #cbd5e1; border-right: 1px solid #e2e8f0;
            font-size: 13px; text-align: center; z-index: 10;
        }
        .th-water { background: #e0f2fe; color: #0284c7; }
        .th-elec { background: #ffedd5; color: #c2410c; }

        td { border-bottom: 1px solid #f1f5f9; border-right: 1px solid #f1f5f9; padding: 0; height: 35px; }

        /* Input Styling - Remove Spinners & Borders */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .cell-input {
            width: 100%; height: 100%; border: none; padding: 0 5px; 
            text-align: right; outline: none; font-family: 'Sarabun'; font-size: 13px;
            background: transparent; transition: 0.1s;
        }
        .cell-input:focus { background: #e0f2fe; box-shadow: inset 0 0 0 2px var(--primary); }
        
        /* Specific Columns */
        .col-room input { text-align: left; font-weight: bold; color: #334155; background: #f8fafc; }
        .col-calc { background: #f8fafc; color: #64748b; font-weight: 600; pointer-events: none; } /* Calculated fields usually readonly but user wants freedom so we allow edit via js override if needed */
        .col-money { font-weight: bold; color: #0f172a; }
        
        .btn-add-room { width: 100%; padding: 10px; border: 2px dashed #cbd5e1; background: #f8fafc; color: #64748b; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn-add-room:hover { background: #e2e8f0; color: #334155; border-color: #94a3b8; }

        .del-btn { color: #ef4444; cursor: pointer; opacity: 0.5; transition: 0.2s; border:none; background:none;}
        .del-btn:hover { opacity: 1; transform: scale(1.2); }

        .status-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 10px 25px; border-radius: 50px; font-size: 13px; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="container-fluid" style="max-width: 1600px;">
    
    <div class="control-bar">
        <div class="d-flex align-items-center gap-3">
            <h5 class="m-0 fw-bold text-primary"><i class="fas fa-edit"></i> บันทึกมิเตอร์ (อิสระ)</h5>
            <div class="d-flex align-items-center bg-light px-3 py-1 rounded-pill border">
                <span class="small fw-bold text-muted me-2">เดือน:</span>
                <input type="month" id="monthPicker" style="border:none; background:transparent; font-weight:bold; color:#0284c7; outline:none;" onchange="loadData()">
            </div>
        </div>
        <div class="d-flex gap-2">
            <a href="index.html" class="btn btn-light border rounded-pill fw-bold">กลับ</a>
            <button class="btn btn-success rounded-pill fw-bold px-4" onclick="saveToCloud()"><i class="fas fa-save"></i> บันทึก</button>
        </div>
    </div>

    <div class="table-container">
        <table id="meterTable">
            <thead>
                <tr>
                    <th rowspan="2" style="width:40px;">#</th>
                    <th rowspan="2" style="width:80px;">ห้อง</th>
                    <th colspan="4" class="th-water">💧 ประปา (ขั้นต่ำ 4)</th>
                    <th colspan="4" class="th-elec">⚡ ไฟฟ้า</th>
                    <th rowspan="2" style="width:70px;">ค่าเช่า</th>
                    <th rowspan="2" style="width:70px;">ส่วนกลาง</th>
                    <th rowspan="2" style="width:60px;">เน็ต</th>
                    <th rowspan="2" style="width:120px;">อื่นๆ/หนี้</th>
                    <th rowspan="2" style="width:90px;">รวมสุทธิ</th>
                </tr>
                <tr>
                    <th style="width:60px;">เก่า</th><th style="width:60px;">ใหม่</th><th style="width:40px;">Rate</th><th style="width:50px;">รวม</th>
                    <th style="width:60px;">เก่า</th><th style="width:60px;">ใหม่</th><th style="width:40px;">Rate</th><th style="width:50px;">รวม</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
    
    <button class="btn-add-room" onclick="addNewRow()">+ เพิ่มห้องใหม่</button>

</div>

<div class="status-bar" id="statusMsg"><i class="fas fa-check-circle text-success"></i> พร้อมใช้งาน</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbytJyg1eNsBSj6c10DaBp8ESrihAh1ZhB__FUUMBAbCYKh2DE0mRqFjrbJcZf6ch-Q/exec"; 
    
    // Default Data Structure if empty
    let currentData = [];
    const DEFAULT_ZONES = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P'];
    const DEFAULT_ROOM_COUNT = 20; // Default creation size

    window.onload = function() {
        const now = new Date();
        document.getElementById('monthPicker').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        loadData();
    };

    function loadData() {
        const k = document.getElementById('monthPicker').value;
        updateStatus("กำลังโหลด...", true);
        
        fetch(API_URL + "?action=load&key=" + k)
        .then(r => r.json())
        .then(res => {
            if(res.status==="success" && res.data) {
                const d = JSON.parse(res.data);
                currentData = Array.isArray(d) ? d : d.rooms||[];
            } else {
                // If new month, create default structure A1-P20
                createDefaultStructure();
            }
            renderTable();
            updateStatus("ข้อมูลล่าสุด");
        })
        .catch(err => {
            console.error(err);
            createDefaultStructure();
            renderTable();
            updateStatus("โหลด Local (Error)");
        });
    }

    function createDefaultStructure() {
        currentData = [];
        DEFAULT_ZONES.forEach(z => {
            for(let i=1; i<=DEFAULT_ROOM_COUNT; i++) {
                currentData.push(createEmptyRow(z+i));
            }
        });
        // Add common areas
        ["ปั้มบาดาล1","ปั้มบาดาล2","ปั้มส่งแท้ง+3","ตู้ซักผ้า","กล้องA","กล้องC","กล้องG","กล้องF","ของชํ่าป่ายาง"].forEach(c => {
            currentData.push(createEmptyRow(c, true));
        });
    }

    function createEmptyRow(id, isCommon=false) {
        return {
            id: id, w_old: '', w_new: '', w_rate: 30, e_old: '', e_new: '', e_rate: 8,
            rent: isCommon?0:3000, custom: 0, internet: 0, extra: 0, isCommon: isCommon
        };
    }

    function renderTable() {
        const tb = document.getElementById('tableBody');
        tb.innerHTML = '';

        currentData.forEach((r, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-center"><button class="del-btn" onclick="deleteRow(${index})">&times;</button></td>
                <td class="col-room"><input type="text" class="cell-input nav-input" value="${r.id}" onchange="updateData(${index}, 'id', this.value)"></td>
                
                <td><input type="number" class="cell-input nav-input" value="${r.w_old}" oninput="calc(${index}, 'w', this.value, 'old')"></td>
                <td><input type="number" class="cell-input nav-input fw-bold" value="${r.w_new}" oninput="calc(${index}, 'w', this.value, 'new')"></td>
                <td><input type="number" class="cell-input nav-input text-center text-muted" value="${r.w_rate}" oninput="calc(${index}, 'w', this.value, 'rate')"></td>
                <td><input type="text" id="w_total_${index}" class="cell-input col-calc text-primary" readonly value="0"></td>
                
                <td><input type="number" class="cell-input nav-input" value="${r.e_old}" oninput="calc(${index}, 'e', this.value, 'old')"></td>
                <td><input type="number" class="cell-input nav-input fw-bold" value="${r.e_new}" oninput="calc(${index}, 'e', this.value, 'new')"></td>
                <td><input type="number" class="cell-input nav-input text-center text-muted" value="${r.e_rate}" oninput="calc(${index}, 'e', this.value, 'rate')"></td>
                <td><input type="text" id="e_total_${index}" class="cell-input col-calc text-danger" readonly value="0"></td>
                
                <td><input type="number" class="cell-input nav-input col-money" value="${r.rent}" oninput="updateData(${index}, 'rent', this.value)"></td>
                <td><input type="number" class="cell-input nav-input" value="${r.custom}" oninput="updateData(${index}, 'custom', this.value)"></td>
                <td><input type="number" class="cell-input nav-input" value="${r.internet}" oninput="updateData(${index}, 'internet', this.value)"></td>
                <td><input type="number" class="cell-input nav-input text-danger" value="${r.extra||0}" oninput="updateData(${index}, 'extra', this.value)"></td>
                
                <td><input type="text" id="grand_total_${index}" class="cell-input col-money text-success fw-bold text-end pe-2" readonly value="0"></td>
            `;
            tb.appendChild(tr);
            // Run initial calc without saving to avoid loop
            calculateRowUI(index);
        });
        
        setupNavigation();
    }

    // --- Calculation Logic ---
    function calc(idx, type, val, field) {
        // Update data model
        if(field === 'old') currentData[idx][type+'_old'] = val;
        if(field === 'new') currentData[idx][type+'_new'] = val;
        if(field === 'rate') currentData[idx][type+'_rate'] = val;
        
        calculateRowUI(idx);
    }

    function updateData(idx, field, val) {
        currentData[idx][field] = val;
        calculateRowUI(idx);
    }

    function calculateRowUI(idx) {
        const r = currentData[idx];
        
        // Water
        let wn = parseFloat(r.w_new) || 0;
        let wo = parseFloat(r.w_old) || 0;
        let wr = parseFloat(r.w_rate) || 0;
        let wTotal = 0;
        if(r.w_new && r.w_old) {
            let diff = wn - wo;
            if(diff < 0) diff = 0; // Prevent negative
            // Rule: Min 4 units for rooms, but maybe not common areas. 
            // For freedom, we apply min 4 but user can edit rate if they want.
            let units = (!r.isCommon && diff < 4) ? 4 : diff; 
            wTotal = units * wr;
        }
        document.getElementById(`w_total_${idx}`).value = wTotal;

        // Elec
        let en = parseFloat(r.e_new) || 0;
        let eo = parseFloat(r.e_old) || 0;
        let er = parseFloat(r.e_rate) || 0;
        let eTotal = 0;
        if(r.e_new && r.e_old) {
            let diff = en - eo;
            if(diff < 0) diff = 0;
            eTotal = diff * er;
        }
        document.getElementById(`e_total_${idx}`).value = eTotal;

        // Grand Total
        let rent = parseFloat(r.rent) || 0;
        let cust = parseFloat(r.custom) || 0;
        let net = parseFloat(r.internet) || 0;
        let ext = parseFloat(r.extra) || 0; // New Extra/Debt field
        
        let grand = rent + cust + net + ext + wTotal + eTotal;
        document.getElementById(`grand_total_${idx}`).value = grand.toLocaleString();
    }

    // --- Dynamic Rows ---
    function addNewRow() {
        currentData.push(createEmptyRow("New Room"));
        renderTable();
        window.scrollTo(0, document.body.scrollHeight);
    }

    function deleteRow(idx) {
        if(confirm("ลบแถวนี้?")) {
            currentData.splice(idx, 1);
            renderTable();
        }
    }

    // --- Navigation & Paste ---
    function setupNavigation() {
        const inputs = document.querySelectorAll('.nav-input');
        const gridWidth = 11; // Number of inputs per row (ID, W-Old, W-New, W-Rate, E-Old, E-New, E-Rate, Rent, Cust, Net, Extra)

        inputs.forEach((input, i) => {
            input.onkeydown = (e) => {
                if(e.key.startsWith('Arrow')) {
                    e.preventDefault();
                    let targetIndex = i;
                    if(e.key === 'ArrowRight') targetIndex++;
                    if(e.key === 'ArrowLeft') targetIndex--;
                    if(e.key === 'ArrowDown') targetIndex += gridWidth;
                    if(e.key === 'ArrowUp') targetIndex -= gridWidth;
                    
                    if(inputs[targetIndex]) {
                        inputs[targetIndex].focus();
                        inputs[targetIndex].select();
                    }
                }
            };

            // Smart Paste (Spreadsheet style)
            input.onpaste = (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                const rows = pasteData.split(/\r?\n/).filter(v => v !== '');
                
                // Determine starting coordinate
                // We need to know which row/col this input belongs to
                // Simpler approach: iterate inputs from current position
                let startIdx = i; 
                
                rows.forEach((rowStr, rOffset) => {
                    const cols = rowStr.split('\t');
                    cols.forEach((val, cOffset) => {
                        // Calculate target input index: Current + (RowOffset * GridWidth) + ColOffset
                        let targetIdx = startIdx + (rOffset * gridWidth) + cOffset;
                        
                        if(inputs[targetIdx]) {
                            // Ensure we don't wrap to next row incorrectly if pasting near right edge
                            // Check if inputs[targetIdx] is in the correct logical row (Advanced check omitted for speed, trust user visual)
                            inputs[targetIdx].value = val.trim();
                            inputs[targetIdx].dispatchEvent(new Event('input')); // Trigger calc
                            inputs[targetIdx].dispatchEvent(new Event('change')); // Trigger update
                        }
                    });
                });
            };
        });
    }

    function saveToCloud() {
        updateStatus("กำลังบันทึก...", true);
        fetch(API_URL + "?action=save&key=" + document.getElementById('monthPicker').value, {
            method: "POST",
            body: JSON.stringify({ rooms: currentData })
        })
        .then(r => r.json())
        .then(res => {
            if(res.status==="success") {
                updateStatus("บันทึกแล้ว " + new Date().toLocaleTimeString());
                alert("✅ บันทึกสำเร็จ!");
            } else { alert("Error: " + res.message); }
        })
        .catch(() => updateStatus("❌ บันทึกไม่สำเร็จ", false));
    }

    function updateStatus(msg, loading=false) {
        document.getElementById('statusMsg').innerHTML = loading ? `<i class="fas fa-spinner fa-spin text-warning"></i> ${msg}` : `<i class="fas fa-check-circle text-success"></i> ${msg}`;
    }
</script>
</body>
</html>
