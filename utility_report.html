<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุปค่าน้ำ-ไฟ รายห้อง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f8fafc; padding: 20px; }
        .main-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; font-size: 13px; }
        th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: center; vertical-align: middle; }
        th { background: #0f172a; color: white; position: sticky; top: 0; }
        
        .room-col { background: #f1f5f9; font-weight: bold; width: 60px; font-size: 14px; }
        .type-col { width: 50px; font-weight: bold; }
        .type-w { color: #0284c7; background: #f0f9ff; }
        .type-e { color: #c2410c; background: #fff7ed; }
        .val { font-family: monospace; font-size: 13px; }
        
        @media print { .no-print { display: none; } body { background: white; padding: 0; } .main-card { box-shadow: none; } }
    </style>
</head>
<body>

<div class="container-fluid" style="max-width:1400px;">
    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
        <h4 class="fw-bold m-0">📊 สรุปค่าน้ำ-ไฟ รายห้อง (6 เดือน)</h4>
        <div>
            <button class="btn btn-outline-primary btn-sm me-2" onclick="window.print()">พิมพ์</button>
            <a href="index.html" class="btn btn-secondary btn-sm">กลับ</a>
        </div>
    </div>

    <div class="main-card">
        <div id="loading" class="text-center py-5">กำลังประมวลผล...</div>
        <table id="reportTable" style="display:none;">
            <thead>
                <tr id="headerRow">
                    <th rowspan="2" style="background:#fff; color:#000; border:none;"></th> 
                    </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwcFtw8FN2Zu3dte6adaFeigGpErvee8rOGYf1oZMLjMruxHdmqI2rkDVy87GH6tqs/exec"; 
    const monthNames = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

    window.onload = function() {
        fetch(API_URL + "?action=loadUtilityReport").then(r=>r.json()).then(res => {
            if(res.status==="success") renderTable(res.months, res.rooms, res.data);
            else alert("Error");
        });
    };

    function renderTable(months, rooms, data) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('reportTable').style.display = 'table';
        
        // 1. Headers
        const hRow = document.getElementById('headerRow');
        hRow.innerHTML = '<th style="background:#334155;">ห้อง</th><th style="background:#334155;">ประเภท</th>';
        months.forEach(mKey => {
            let [y, m] = mKey.split('-');
            let label = `${monthNames[parseInt(m)-1]} ${String(parseInt(y)+543).slice(-2)}`;
            hRow.innerHTML += `<th>${label}</th>`;
        });

        // 2. Body
        const tbody = document.getElementById('tableBody');
        rooms.forEach(rid => {
            // Water Row
            let htmlW = `<tr><td rowspan="2" class="room-col">${rid}</td><td class="type-col type-w">น้ำ</td>`;
            months.forEach(m => {
                let val = (data[rid][m] && data[rid][m].w) ? data[rid][m].w.toLocaleString() : "-";
                htmlW += `<td class="val">${val}</td>`;
            });
            htmlW += `</tr>`;

            // Elec Row
            let htmlE = `<tr><td class="type-col type-e">ไฟ</td>`;
            months.forEach(m => {
                let val = (data[rid][m] && data[rid][m].e) ? data[rid][m].e.toLocaleString() : "-";
                htmlE += `<td class="val">${val}</td>`;
            });
            htmlE += `</tr>`;

            tbody.innerHTML += htmlW + htmlE;
        });
    }
</script>
</body>
</html>
