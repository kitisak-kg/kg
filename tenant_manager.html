<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการผู้เช่า (Excel Style) - หอพัก K&G</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #0284c7; --bg: #f8fafc; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); padding: 20px; padding-bottom: 100px; }
        
        .header-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        /* Table Styling */
        .table-responsive { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-height: 80vh; overflow-x: auto; }
        .table-excel { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 1200px; }
        .table-excel th { position: sticky; top: 0; background: #f1f5f9; color: #475569; padding: 10px; font-weight: 700; border-bottom: 2px solid #e2e8f0; z-index: 10; text-align: center; white-space: nowrap; }
        .table-excel td { border-bottom: 1px solid #f1f5f9; padding: 0; height: 38px; vertical-align: middle; border-right: 1px solid #f8fafc; }
        
        /* Input Styling */
        .cell-input { width: 100%; height: 100%; border: none; padding: 0 8px; outline: none; background: transparent; transition: 0.1s; font-family: 'Sarabun'; font-size: 13px; }
        .cell-input:focus { background: #e0f2fe; box-shadow: inset 0 0 0 2px var(--primary); }
        .cell-select { width: 100%; height: 100%; border: none; outline: none; background: transparent; padding: 0 5px; cursor: pointer; font-size: 12px; font-weight: 700; }
        
        /* Remove Spinners */
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Colors */
        .col-id input { text-align: center; font-weight: 800; color: #334155; background: #f8fafc; }
        .st-active { color: #166534; background: #dcfce7; }
        .st-empty { color: #94a3b8; background: #f8fafc; }
        .st-moving { color: #854d0e; background: #fef9c3; }
        .st-moved-room { color: #0369a1; background: #e0f2fe; }
        .st-runaway { color: #991b1b; background: #fee2e2; border-left: 4px solid #ef4444; }

        .btn-add-row { width: 100%; padding: 8px; border: 2px dashed #cbd5e1; background: #f8fafc; color: #64748b; font-weight: bold; margin-top: 10px; transition: 0.2s; text-align: center; cursor: pointer; }
        .btn-add-row:hover { background: #e2e8f0; color: #334155; border-color: #94a3b8; }
        .del-btn { color: #ef4444; cursor: pointer; opacity: 0.4; border:none; background:none; transition:0.2s; font-size: 16px; }
        .del-btn:hover { opacity: 1; transform: scale(1.2); }

        .status-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 10px 25px; border-radius: 50px; font-size: 13px; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        
        /* Side Panel */
        .wait-item { border-bottom: 1px solid #eee; padding: 8px; background: white; margin-bottom: 5px; border-radius: 6px; border:1px solid #e2e8f0; position: relative; }
        .room-tag { background: #0f172a; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container-fluid" style="max-width: 1800px;">
    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold m-0"><i class="fas fa-table text-primary"></i> จัดการผู้เช่า (Excel Style)</h4>
        <div class="d-flex gap-2">
            <a href="index.html" class="btn btn-light border fw-bold rounded-pill px-3">กลับเมนู</a>
            <button class="btn btn-success fw-bold px-4 rounded-pill" onclick="saveToCloud()"><i class="fas fa-save"></i> บันทึกข้อมูล</button>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-9">
            <div class="table-responsive">
                <table class="table-excel">
                    <thead>
                        <tr>
                            <th style="width:40px;">#</th>
                            <th style="width:70px;">ห้อง</th>
                            <th style="width:130px;">สถานะ</th>
                            <th style="width:180px;">ชื่อ-นามสกุล</th>
                            <th style="width:110px;">เบอร์โทร</th>
                            <th style="width:90px;">เงินมัดจำ</th>
                            <th style="width:110px;">เริ่มสัญญา</th>
                            <th style="width:110px;">หมดสัญญา</th>
                            <th style="width:90px;">ค้างชำระ</th>
                            <th>หมายเหตุ</th>
                            <th style="width:50px;">ประวัติ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <button class="btn-add-row" onclick="addNewRow()">+ เพิ่มห้องใหม่ (Add Room)</button>
        </div>

        <div class="col-lg-3">
            <div class="card border-0 shadow-sm p-3 h-100 bg-white" style="border-radius: 12px; max-height: 85vh; overflow-y: auto;">
                <div class="d-flex justify-content-between align-items-center mb-3 sticky-top bg-white pb-2 border-bottom">
                    <h6 class="fw-bold m-0 text-primary"><i class="fas fa-user-clock"></i> คิวรอห้อง / จอง</h6>
                    <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="addWaitList()">+ เพิ่ม</button>
                </div>
                <div id="waitingListContainer"></div>
            </div>
        </div>
    </div>

</div>

<div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-light py-2">
                <h6 class="modal-title fw-bold"><i class="fas fa-tools"></i> ประวัติห้อง: <span id="h_room_id" class="text-primary"></span></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="input-group mb-3">
                    <input type="date" id="h_date" class="form-control form-control-sm" style="max-width: 130px;">
                    <input type="text" id="h_text" class="form-control form-control-sm" placeholder="เช่น เจาะผนัง, ซ่อมก๊อก">
                    <button class="btn btn-primary btn-sm" onclick="addHistoryItem()">เพิ่ม</button>
                </div>
                <div id="historyList" style="max-height: 300px; overflow-y: auto; background: #f8fafc; border-radius: 8px; padding: 10px;"></div>
            </div>
        </div>
    </div>
</div>

<div class="status-bar" id="statusMsg"><i class="fas fa-check-circle text-success"></i> พร้อมใช้งาน</div>

        {id:'N7',name:'เจษฎาภรณ์ จำปาสา',phone:'094-4905850',deposit:'3000',start:'2025-01-08',end:'2026-01-08'},
        {id:'N8',name:'ดุลยทรรศน์ ศรีโครต',phone:'085-6033592',deposit:'3000',start:'2025-01-08',end:'2026-01-02'},
        {id:'N9',name:'ธนาคาร ทองโครต',phone:'082-9086146',deposit:'3000',start:'2025-01-08',end:'2026-01-08'}
    ];

    let tenants = [], waitingList = [];
    let currentHistoryId = null;

    window.onload = function() {
        loadData();
    };

    function loadData() {
        updateStatus("กำลังโหลด...", true);
        fetch(API_URL + "?action=loadTenants").then(r=>r.json()).then(res => {
            if(res.status==="success" && res.tenants && res.tenants.length > 0) {
                tenants = generateStructure(res.tenants);
                waitingList = res.waiting || [];
            } else {
                tenants = generateStructure(UPDATED_TENANTS);
            }
            renderTable();
            refreshWaitingList();
            updateStatus("ข้อมูลล่าสุด");
        }).catch(() => {
            tenants = generateStructure(UPDATED_TENANTS);
            renderTable();
            updateStatus("โหลด Local");
        });
    }

    function generateStructure(loadedData) {
        let newData = [];
        // สร้างโครงสร้าง A1-P20
        ZONES.forEach(z => {
            for(let i=1; i<=ROOMS_PER_ZONE; i++) {
                let id = z+i;
                let found = loadedData.find(t => t.id === id);
                if(found) {
                    if(!found.history) found.history = [];
                    newData.push(found);
                } else {
                    newData.push({
                        id: id, name: '', phone: '', deposit: '', 
                        contract_start: '', contract_end: '', status: 'Empty', debt: 0, note: '',
                        history: []
                    });
                }
            }
        });
        
        // Auto-Status Logic
        newData.forEach(t => {
            if(!t.status || t.status==='Active' || t.status==='Empty') {
                t.status = (t.name && t.name.trim() !== '') ? 'Active' : 'Empty';
            }
        });
        return newData;
    }

    function renderTable() {
        const tb = document.getElementById('tableBody'); tb.innerHTML = '';
        
        tenants.forEach((t, idx) => {
            let statusClass = 'st-empty';
            if(t.status === 'Active') statusClass = 'st-active';
            else if(t.status === 'MovingOut') statusClass = 'st-moving';
            else if(t.status === 'MovedRoom') statusClass = 'st-moved-room';
            else if(t.status === 'RunAway' || t.status === 'Debt') statusClass = 'st-runaway';

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-center"><button class="del-btn" onclick="deleteRow(${idx})">&times;</button></td>
                <td class="col-id"><input type="text" class="cell-input nav-item fw-bold text-center" data-idx="${idx}" data-field="id" value="${t.id}" oninput="updateData(this)"></td>
                <td class="${statusClass}">
                    <select class="cell-select nav-item" data-idx="${idx}" data-field="status" onchange="updateStatusColor(this)">
                        <option value="Active" ${t.status==='Active'?'selected':''}>🟢 อยู่ปกติ</option>
                        <option value="Empty" ${t.status==='Empty'?'selected':''}>⚪ ห้องว่าง</option>
                        <option value="MovingOut" ${t.status==='MovingOut'?'selected':''}>🟡 แจ้งย้าย</option>
                        <option value="MovedRoom" ${t.status==='MovedRoom'?'selected':''}>🔵 ย้ายห้อง</option>
                        <option value="RunAway" ${t.status==='RunAway'?'selected':''}>🚨 หนี/เชิญออก</option>
                        <option value="Debt" ${t.status==='Debt'?'selected':''}>🔴 ค้าง</option>
                    </select>
                </td>
                <td><input type="text" class="cell-input nav-item" data-idx="${idx}" data-field="name" value="${t.name||''}" oninput="updateData(this)"></td>
                <td><input type="text" class="cell-input nav-item" data-idx="${idx}" data-field="phone" value="${t.phone||''}" oninput="updateData(this)"></td>
                <td><input type="number" class="cell-input nav-item" data-idx="${idx}" data-field="deposit" value="${t.deposit||''}" oninput="updateData(this)"></td>
                <td><input type="date" class="cell-input nav-item" data-idx="${idx}" data-field="contract_start" value="${t.contract_start||''}" oninput="updateData(this)"></td>
                <td><input type="date" class="cell-input nav-item" data-idx="${idx}" data-field="contract_end" value="${t.contract_end||''}" oninput="updateData(this)"></td>
                <td><input type="number" class="cell-input nav-item text-danger fw-bold" data-idx="${idx}" data-field="debt" value="${t.debt||''}" oninput="updateData(this)"></td>
                <td><input type="text" class="cell-input nav-item" data-idx="${idx}" data-field="note" value="${t.note||''}" oninput="updateData(this)"></td>
                <td class="text-center">
                    <button class="btn btn-sm border-0 ${t.history&&t.history.length>0?'text-primary':'text-muted'}" onclick="openHistory('${t.id}')">
                        <i class="fas fa-tools"></i>
                    </button>
                </td>
            `;
            tb.appendChild(tr);
        });
        
        setupNavigation();
    }

    function updateData(input) {
        let idx = parseInt(input.dataset.idx);
        let field = input.dataset.field;
        tenants[idx][field] = input.value;
    }

    function updateStatusColor(select) {
        let td = select.parentElement;
        td.className = ''; 
        if(select.value === 'Active') td.classList.add('st-active');
        else if(select.value === 'Empty') td.classList.add('st-empty');
        else if(select.value === 'MovingOut') td.classList.add('st-moving');
        else if(select.value === 'MovedRoom') td.classList.add('st-moved-room');
        else if(select.value === 'RunAway' || select.value === 'Debt') td.classList.add('st-runaway');
        
        let idx = parseInt(select.dataset.idx);
        tenants[idx].status = select.value;
    }

    // --- Dynamic Rows ---
    function addNewRow() {
        tenants.push({ id: 'New', name: '', status: 'Empty', history: [] });
        renderTable();
        window.scrollTo(0, document.body.scrollHeight);
    }

    function deleteRow(idx) {
        if(confirm("ลบแถวนี้?")) {
            tenants.splice(idx, 1);
            renderTable();
        }
    }

    // --- Navigation & Paste ---
    function setupNavigation() {
        const inputs = document.querySelectorAll('.nav-item');
        const gridWidth = 9; // Approx inputs per row

        inputs.forEach((input, i) => {
            input.onkeydown = (e) => {
                if(e.key.startsWith('Arrow')) {
                    e.preventDefault(); // Stop native scroll/select behavior for consistent grid nav
                    let targetIndex = i;
                    if(e.key === 'ArrowRight') targetIndex++;
                    if(e.key === 'ArrowLeft') targetIndex--;
                    // Simple heuristic for Up/Down: jump by width (approx)
                    // Better: find input with same field in prev/next row
                    if(e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                        let currentField = input.dataset.field;
                        let currentIdx = parseInt(input.dataset.idx);
                        let nextIdx = (e.key === 'ArrowDown') ? currentIdx + 1 : currentIdx - 1;
                        let nextInput = document.querySelector(`.nav-item[data-idx="${nextIdx}"][data-field="${currentField}"]`);
                        if(nextInput) { nextInput.focus(); nextInput.select(); return; }
                    }
                    
                    if(inputs[targetIndex]) {
                        inputs[targetIndex].focus();
                        inputs[targetIndex].select();
                    }
                }
            };

            // Smart Paste
            input.onpaste = (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                const rows = pasteData.split(/\r?\n/).filter(v => v !== '');
                
                // Get starting position logic
                // We need to know which visual row/col we are at.
                // Simple logic: process line by line, find next input with same field for next line
                
                let currentField = input.dataset.field;
                let startRowIdx = parseInt(input.dataset.idx);
                
                // This simple paste handles 1 column pasting (vertical) which is most common
                // If user pastes a 2D block, it's complex. Let's support Vertical Paste primarily.
                
                rows.forEach((val, offset) => {
                    let targetRowIdx = startRowIdx + offset;
                    // Handle tab separation for 2D paste if needed (simple version)
                    let cols = val.split('\t');
                    
                    // Logic: Find row at targetRowIdx
                    if (targetRowIdx < tenants.length) {
                        // If multiple cols, we need to find siblings.
                        // For now, let's just paste the first col to current field to ensure stability
                        // or try to support Name -> Phone -> Deposit flow
                        
                        // Let's assume user pastes into Name, then Phone, etc.
                        // Find the input element
                        let targetInput = document.querySelector(`.nav-item[data-idx="${targetRowIdx}"][data-field="${currentField}"]`);
                        if(targetInput) {
                            targetInput.value = cols[0].trim();
                            tenants[targetRowIdx][currentField] = cols[0].trim();
                            
                            // Auto-Active if pasting name
                            if(currentField === 'name' && cols[0].trim() !== '') {
                                tenants[targetRowIdx].status = 'Active';
                                let sel = document.querySelector(`.nav-item[data-idx="${targetRowIdx}"][data-field="status"]`);
                                if(sel) { sel.value = 'Active'; updateStatusColor(sel); }
                            }
                        }
                        
                        // Attempt to paste subsequent columns if they exist (Name -> Phone)
                        if(cols.length > 1) {
                            // Define field order
                            const fieldOrder = ['id','status','name','phone','deposit','contract_start','contract_end','debt','note'];
                            let fieldPos = fieldOrder.indexOf(currentField);
                            if(fieldPos !== -1) {
                                for(let c=1; c<cols.length; c++) {
                                    let nextField = fieldOrder[fieldPos+c];
                                    if(nextField) {
                                        let nextInput = document.querySelector(`.nav-item[data-idx="${targetRowIdx}"][data-field="${nextField}"]`);
                                        if(nextInput) {
                                            nextInput.value = cols[c].trim();
                                            tenants[targetRowIdx][nextField] = cols[c].trim();
                                        }
                                    }
                                }
                            }
                        }
                    }
                });
            };
        });
    }

    // --- Waiting List & History (Standard) ---
    function addWaitList() {
        let room = prompt("จองห้อง (ถ้ามี):", "");
        let name = prompt("ชื่อคนจอง:");
        if(name) {
            let phone = prompt("เบอร์โทร:");
            let note = prompt("หมายเหตุ:", "");
            waitingList.push({ room: room, name: name, phone: phone, note: note });
            refreshWaitingList();
        }
    }
    function removeWait(idx) { if(confirm("ลบ?")) { waitingList.splice(idx, 1); refreshWaitingList(); } }
    function refreshWaitingList() {
        const wl = document.getElementById('waitingListContainer'); wl.innerHTML = '';
        waitingList.forEach((w,i) => {
            let roomBadge = w.room ? `<span class="room-tag">${w.room}</span>` : '';
            wl.innerHTML += `<div class="wait-item"><div class="fw-bold small">${roomBadge}${w.name}</div><div class="small text-muted"><i class="fas fa-phone"></i> ${w.phone||'-'}</div><button class="btn btn-sm position-absolute top-0 end-0 text-danger" onclick="removeWait(${i})">&times;</button></div>`;
        });
    }

    function openHistory(id) {
        currentHistoryId = id;
        document.getElementById('h_room_id').innerText = id;
        renderHistoryList();
        new bootstrap.Modal(document.getElementById('historyModal')).show();
    }
    function renderHistoryList() {
        const list = document.getElementById('historyList'); list.innerHTML = '';
        const t = tenants.find(x => x.id === currentHistoryId);
        if(!t || !t.history) return;
        [...t.history].reverse().forEach((h,i) => {
            list.innerHTML += `<div class="border-bottom p-2 bg-white mb-1 rounded"><small class="text-muted fw-bold">${h.date}</small> <div class="small">${h.text}</div></div>`;
        });
    }
    function addHistoryItem() {
        const t = tenants.find(x => x.id === currentHistoryId);
        if(t) {
            if(!t.history) t.history = [];
            t.history.push({ date: document.getElementById('h_date').value, text: document.getElementById('h_text').value });
            document.getElementById('h_text').value = ''; renderHistoryList(); renderTable();
        }
    }

    function saveToCloud() {
        updateStatus("กำลังบันทึก...", true);
        fetch(API_URL + "?action=saveTenants", { method: "POST", body: JSON.stringify({ tenants, waiting: waitingList }) })
        .then(r=>r.json()).then(res => { if(res.status==="success") { alert("✅ บันทึกเรียบร้อย"); updateStatus("พร้อมใช้งาน"); } else alert("❌ Error: "+res.message); })
        .catch(() => updateStatus("❌ บันทึกไม่สำเร็จ", false));
    }

    function updateStatus(msg, loading=false) {
        document.getElementById('statusMsg').innerHTML = loading ? `<i class="fas fa-spinner fa-spin text-warning"></i> ${msg}` : `<i class="fas fa-check-circle text-success"></i> ${msg}`;
    }
</script>
