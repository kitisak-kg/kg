<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการผู้เช่า - หอพัก K&G</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #0284c7; --bg: #f8fafc; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); padding: 20px; padding-bottom: 80px; }
        
        .header-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* Table Styling */
        .table-responsive { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-height: 75vh; }
        .table-excel { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        .table-excel th { position: sticky; top: 0; background: #f1f5f9; color: #475569; padding: 10px; font-weight: 700; border-bottom: 2px solid #e2e8f0; z-index: 10; text-align: center; white-space: nowrap; }
        .table-excel td { border-bottom: 1px solid #f1f5f9; padding: 0; height: 45px; vertical-align: middle; }
        
        /* Input Styling */
        .cell-input { width: 100%; height: 100%; border: none; padding: 0 8px; outline: none; background: transparent; transition: 0.2s; font-family: 'Sarabun'; font-size: 13px; }
        .cell-input:focus { background: #e0f2fe; box-shadow: inset 0 0 0 2px var(--primary); }
        .cell-select { width: 100%; height: 100%; border: none; outline: none; background: transparent; padding: 0 5px; cursor: pointer; font-size: 12px; font-weight: 700; }
        
        /* Specific Columns & Status Colors */
        .col-id { background: #f8fafc; font-weight: 800; text-align: center; width: 60px; color: #334155; }
        
        /* Status Colors (Backgrounds for Select) */
        .st-active { color: #166534; background: #dcfce7; }        /* เขียว: อยู่ปกติ */
        .st-empty { color: #94a3b8; background: #f8fafc; }         /* เทา: ว่าง */
        .st-moving { color: #854d0e; background: #fef9c3; }        /* เหลือง: แจ้งย้าย */
        .st-moved-room { color: #0369a1; background: #e0f2fe; }    /* ฟ้า: ย้ายห้อง */
        .st-runaway { color: #991b1b; background: #fee2e2; border-left: 4px solid #ef4444; } /* แดง: หนี/เชิญออก */

        /* Zone & Status Filter Bar */
        .filter-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; align-items: center; }
        .btn-filter { border: 1px solid #cbd5e1; background: white; color: #64748b; border-radius: 20px; padding: 4px 15px; font-weight: 700; font-size: 12px; white-space: nowrap; transition: 0.2s; }
        .btn-filter:hover { background: #f1f5f9; }
        .btn-filter.active { background: #0f172a; color: white; border-color: #0f172a; }
        
        .btn-status-filter { border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: bold; border: 1px solid transparent; opacity: 0.6; }
        .btn-status-filter.active { opacity: 1; transform: scale(1.05); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .s-run { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
        .s-move { background: #fef9c3; color: #854d0e; border-color: #fde047; }
        .s-room { background: #e0f2fe; color: #0369a1; border-color: #7dd3fc; }

        .status-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 10px 25px; border-radius: 50px; font-size: 13px; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        
        .wait-item { border-bottom: 1px solid #eee; padding: 8px; background: white; margin-bottom: 5px; border-radius: 6px; position: relative; border:1px solid #e2e8f0;}
        .room-tag { background: #0f172a; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container-fluid" style="max-width: 1600px;">
    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold m-0"><i class="fas fa-users-cog text-primary"></i> จัดการผู้เช่า (ละเอียด)</h4>
        <div class="d-flex gap-2">
            <a href="index.html" class="btn btn-light border fw-bold">กลับเมนู</a>
            <button class="btn btn-success fw-bold px-4 rounded-pill" onclick="saveToCloud()"><i class="fas fa-save"></i> บันทึกข้อมูล</button>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-9">
            <div class="header-card p-2 mb-2">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div class="filter-bar m-0" id="zoneBar"></div>
                    
                    <div class="d-flex gap-2">
                        <button class="btn-status-filter s-move" onclick="filterStatus('MovingOut')">⚠️ แจ้งย้าย</button>
                        <button class="btn-status-filter s-run" onclick="filterStatus('RunAway')">🚨 หนี/มีปัญหา</button>
                        <button class="btn-status-filter s-room" onclick="filterStatus('MovedRoom')">🔄 ย้ายห้อง</button>
                        <button class="btn-status-filter bg-light border text-dark" onclick="filterStatus('ALL')">แสดงทั้งหมด</button>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table-excel">
                    <thead>
                        <tr>
                            <th style="width:60px;">ห้อง</th>
                            <th style="width:50px;">ประวัติ</th>
                            <th style="width:140px;">สถานะ (ละเอียด)</th>
                            <th style="width:180px;">ชื่อ-นามสกุล</th>
                            <th style="width:110px;">เบอร์โทร</th>
                            <th style="width:80px;">เงินมัดจำ</th>
                            <th style="width:100px;">วันเริ่มสัญญา</th>
                            <th style="width:100px;">วันหมดสัญญา</th>
                            <th style="width:80px;">ค้างชำระ</th>
                            <th>หมายเหตุ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="col-lg-3">
            <div class="card border-0 shadow-sm p-3 h-100 bg-white" style="border-radius: 12px;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold m-0 text-primary"><i class="fas fa-user-clock"></i> คนจอง / รอห้อง</h6>
                    <button class="btn btn-sm btn-outline-primary py-0" style="font-size:12px;" onclick="addWaitList()">+ เพิ่ม</button>
                </div>
                <div id="waitingListContainer" style="overflow-y: auto; max-height: 80vh;"></div>
            </div>
        </div>
    </div>

</div>

<div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-light py-2">
                <h6 class="modal-title fw-bold"><i class="fas fa-tools"></i> ประวัติห้อง: <span id="h_room_id" class="text-primary"></span></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="input-group mb-3">
                    <input type="date" id="h_date" class="form-control form-control-sm" style="max-width: 130px;">
                    <input type="text" id="h_text" class="form-control form-control-sm" placeholder="เช่น เจาะผนัง, ซ่อมก๊อก">
                    <button class="btn btn-primary btn-sm" onclick="addHistoryItem()">เพิ่ม</button>
                </div>
                <div id="historyList" style="max-height: 300px; overflow-y: auto; background: #f8fafc; border-radius: 8px; padding: 10px;"></div>
            </div>
        </div>
    </div>
</div>

<div class="status-bar" id="statusMsg"><i class="fas fa-check-circle text-success"></i> พร้อมใช้งาน</div>

    let tenants = [], waitingList = [];
    let currentZone = 'ALL';
    let currentStatusFilter = 'ALL';
    let currentHistoryId = null;

    window.onload = function() {
        renderZoneButtons();
        loadData();
    };

    function loadData() {
        updateStatus("กำลังโหลด...", true);
        fetch(API_URL + "?action=loadTenants").then(r=>r.json()).then(res => {
            if(res.status==="success" && res.tenants && res.tenants.length > 0) {
                tenants = generateStructure(res.tenants);
                waitingList = res.waiting || [];
            } else {
                tenants = generateStructure(UPDATED_TENANTS);
            }
            renderTable();
            refreshWaitingList();
            updateStatus("ข้อมูลล่าสุด");
        }).catch(() => {
            tenants = generateStructure(UPDATED_TENANTS);
            renderTable();
            updateStatus("โหลด Local");
        });
    }

    function generateStructure(loadedData) {
        let newData = [];
        ZONES.forEach(z => {
            for(let i=1; i<=ROOMS_PER_ZONE; i++) {
                let id = z+i;
                let found = loadedData.find(t => t.id === id);
                if(found) {
                    if(!found.history) found.history = []; 
                    newData.push(found);
                } else {
                    newData.push({
                        id: id, name: '', phone: '', deposit: '', 
                        contract_start: '', contract_end: '', status: 'Empty', debt: 0, note: '',
                        history: []
                    });
                }
            }
        });
        // Normalize Status
        newData.forEach(t => {
            if(!t.status || t.status === 'Active' || t.status === 'Empty') {
                t.status = (t.name && t.name.trim() !== '') ? 'Active' : 'Empty';
            }
        });
        return newData;
    }

    // --- Filters ---
    function renderZoneButtons() {
        const bar = document.getElementById('zoneBar');
        bar.innerHTML = `<button class="btn-filter active" onclick="filterZone('ALL')">ทุกโซน</button>`;
        ZONES.forEach(z => {
            bar.innerHTML += `<button class="btn-filter" onclick="filterZone('${z}')">${z}</button>`;
        });
    }

    function filterZone(z) {
        currentZone = z;
        document.querySelectorAll('#zoneBar .btn-filter').forEach(b => b.classList.toggle('active', b.innerText === (z==='ALL'?'ทุกโซน':z)));
        renderTable();
    }

    function filterStatus(s) {
        currentStatusFilter = s;
        // Reset active style for buttons (simplified)
        // In real use, you might want to toggle active classes on these buttons too
        renderTable();
    }

            "N1","N2","N3","N4","N5","N6","N7","N8","N9","N10"
        ];

        let displayList = tenants;

        // 1. Filter by Zone
        if(currentZone !== 'ALL') {
            displayList = displayList.filter(t => t.id.startsWith(currentZone));
        } else {
            displayList = displayList.filter(t => REAL_ROOMS.includes(t.id));
        }

        // 2. Filter by Status (Quick Filter)
        if(currentStatusFilter !== 'ALL') {
            displayList = displayList.filter(t => t.status === currentStatusFilter);
        }

        displayList.forEach(t => {
            let idx = tenants.indexOf(t); 
            
            // Background class for SELECT element's parent TD
            let statusClass = 'st-empty';
            if(t.status === 'Active') statusClass = 'st-active';
            else if(t.status === 'MovingOut') statusClass = 'st-moving';
            else if(t.status === 'MovedRoom') statusClass = 'st-moved-room';
            else if(t.status === 'RunAway') statusClass = 'st-runaway';
            else if(t.status === 'Debt') statusClass = 'st-runaway'; // ใช้แดงเหมือนกัน

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-id">${t.id}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-secondary border-0" onclick="openHistory('${t.id}')">

                    </button>
                </td>
                <td class="${statusClass}">
                    <select class="cell-select nav-item" data-idx="${idx}" data-field="status" onchange="updateStatusColor(this)">
                        <option value="Active" ${t.status==='Active'?'selected':''}>🟢 อยู่ปกติ</option>
                        <option value="Empty" ${t.status==='Empty'?'selected':''}>⚪ ห้องว่าง</option>
                        <option value="MovingOut" ${t.status==='MovingOut'?'selected':''}>🟡 แจ้งย้ายออก</option>
                        <option value="MovedRoom" ${t.status==='MovedRoom'?'selected':''}>🔵 ย้ายห้อง (Internal)</option>
                        <option value="RunAway" ${t.status==='RunAway'?'selected':''}>🚨 หนี/เชิญออก</option>
                        <option value="Debt" ${t.status==='Debt'?'selected':''}>🔴 ค้างชำระ</option>
                    </select>
                </td>
                <td><input type="text" class="cell-input nav-item" data-idx="${idx}" data-field="name" value="${t.name}"></td>
                <td><input type="text" class="cell-input nav-item" data-idx="${idx}" data-field="phone" value="${t.phone}"></td>
                <td><input type="number" class="cell-input nav-item" data-idx="${idx}" data-field="deposit" value="${t.deposit}"></td>
                <td><input type="date" class="cell-input nav-item" data-idx="${idx}" data-field="contract_start" value="${t.contract_start}"></td>
                <td><input type="date" class="cell-input nav-item" data-idx="${idx}" data-field="contract_end" value="${t.contract_end}"></td>
                <td><input type="number" class="cell-input nav-item text-danger fw-bold" data-idx="${idx}" data-field="debt" value="${t.debt}"></td>
                <td><input type="text" class="cell-input nav-item" data-idx="${idx}" data-field="note" value="${t.note}"></td>
            `;
            tb.appendChild(tr);
        });

        setupEvents();
    }

    function updateStatusColor(select) {
        let td = select.parentElement;
        td.className = ''; 
        if(select.value === 'Active') td.classList.add('st-active');
        else if(select.value === 'Empty') td.classList.add('st-empty');
        else if(select.value === 'MovingOut') td.classList.add('st-moving');
        else if(select.value === 'MovedRoom') td.classList.add('st-moved-room');
        else if(select.value === 'RunAway' || select.value === 'Debt') td.classList.add('st-runaway');
        
        let idx = parseInt(select.dataset.idx);
        tenants[idx].status = select.value;
    }

    // --- Waiting List & History Logic (Same as before) ---
    function addWaitList() {
        let room = prompt("จองห้อง (ถ้ามี):", "");
        let name = prompt("ชื่อคนจอง:");
        if(name) {
            let phone = prompt("เบอร์โทร:");
            let note = prompt("หมายเหตุ:", "");
            waitingList.push({ room: room, name: name, phone: phone, note: note });
            refreshWaitingList();
        }
    }

    function removeWait(idx) {
        if(confirm("ลบรายชื่อนี้?")) {
            waitingList.splice(idx, 1);
            refreshWaitingList();
        }
    }

    function refreshWaitingList() {
        const wl = document.getElementById('waitingListContainer'); 
        wl.innerHTML = '';
        waitingList.forEach((w,i) => {
            let roomBadge = w.room ? `<span class="room-tag">${w.room}</span>` : '';
            wl.innerHTML += `
            <div class="wait-item position-relative">
                <div class="fw-bold small">${roomBadge}${w.name}</div>
                <div class="small text-muted"><i class="fas fa-phone"></i> ${w.phone || '-'}</div>
                ${w.note ? `<div class="small text-warning"><i class="fas fa-sticky-note"></i> ${w.note}</div>` : ''}
                <button class="btn btn-sm position-absolute top-0 end-0 text-danger" onclick="removeWait(${i})">&times;</button>
            </div>`;
        });
    }

    function openHistory(id) {
        currentHistoryId = id;
        document.getElementById('h_room_id').innerText = id;
        document.getElementById('h_date').valueAsDate = new Date();
        document.getElementById('h_text').value = '';
        renderHistoryList();
        new bootstrap.Modal(document.getElementById('historyModal')).show();
    }

    function renderHistoryList() {
        const list = document.getElementById('historyList'); list.innerHTML = '';
        const t = tenants.find(x => x.id === currentHistoryId);
        if(!t || !t.history) return;
        [...t.history].reverse().forEach((h, i) => {
            list.innerHTML += `<div class="border-bottom p-2 bg-white mb-1 rounded"><small class="text-muted fw-bold">${new Date(h.date).toLocaleDateString('th-TH')}</small><div class="small">${h.text}</div></div>`;
        });
    }

    function addHistoryItem() {
        const date = document.getElementById('h_date').value;
        const text = document.getElementById('h_text').value;
        if(!text) return;
        const t = tenants.find(x => x.id === currentHistoryId);
        if(t) {
            if(!t.history) t.history = [];
            t.history.push({ date: date, text: text });
            document.getElementById('h_text').value = ''; renderHistoryList(); renderTable();
        }
    }
