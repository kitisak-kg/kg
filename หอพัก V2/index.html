<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หอพัก K&G - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --primary: #0284c7; --primary-dark: #0c4a6e; --bg: #f8fafc; --text: #334155; }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; color: white; margin: 0 auto 15px auto; box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3); }
        h1 { margin: 0; font-weight: 800; font-size: 24px; color: #0f172a; }
        p { color: #64748b; margin-top: 5px; font-weight: 600; font-size: 14px; }
        .menu-grid { display: grid; gap: 15px; }
        .menu-card { background: white; padding: 15px 20px; border-radius: 16px; display: flex; align-items: center; gap: 20px; text-decoration: none; color: inherit; border: 1px solid #e2e8f0; transition: all 0.2s; }
        .menu-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: var(--primary); }
        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .title { font-weight: 800; font-size: 16px; display: block; color: #334155; }
        .desc { font-size: 12px; color: #94a3b8; margin-top: 2px; display: block; }
        
        .theme-red { background: #fef2f2; color: #dc2626; }
        .theme-blue { background: #eff6ff; color: #2563eb; }
        .theme-orange { background: #fff7ed; color: #ea580c; }
        .theme-purple { background: #faf5ff; color: #9333ea; }
        .theme-green { background: #f0fdf4; color: #16a34a; }
        
        .btn-lock { margin-top: 30px; text-align: center; }
        .btn-lock button { background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-lock button:hover { color: #ef4444; }
        .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo"><i class="fas fa-building"></i></div>
            <h1>หอพัก K&G</h1>
            <p>ระบบจัดการหลังบ้าน (น้องกัน)</p>
        </div>

        <div class="menu-grid">
            <a href="tenant_manager.html" class="menu-card" style="border-left: 4px solid #dc2626;">
                <div class="icon-box theme-red"><i class="fas fa-users-cog"></i></div>
                <div>
                    <span class="title">จัดการผู้เช่า (Tenant)</span>
                    <span class="desc">รายชื่อคนเช่า / คนจอง / คนย้าย</span>
                </div>
            </a>

            <a href="record_monthly.html" class="menu-card">
                <div class="icon-box theme-blue"><i class="fas fa-edit"></i></div>
                <div>
                    <span class="title">1. บันทึกมิเตอร์</span>
                    <span class="desc">จดค่าน้ำ-ไฟ ประจำเดือน</span>
                </div>
            </a>

            <a href="collection_checklist.html" class="menu-card">
                <div class="icon-box theme-orange"><i class="fas fa-clipboard-check"></i></div>
                <div>
                    <span class="title">2. ใบเช็คลิสต์เก็บเงิน</span>
                    <span class="desc">พิมพ์ใบ A4 เดินเก็บหน้างาน</span>
                </div>
            </a>

            <a href="receipt_view.html" class="menu-card">
                <div class="icon-box theme-purple"><i class="fas fa-receipt"></i></div>
                <div>
                    <span class="title">3. พิมพ์ใบเสร็จ</span>
                    <span class="desc">พิมพ์ใบเสร็จรายห้อง</span>
                </div>
            </a>

            <a href="summary_report.html" class="menu-card">
                <div class="icon-box theme-green"><i class="fas fa-chart-pie"></i></div>
                <div>
                    <span class="title">4. รายงานสรุป</span>
                    <span class="desc">ดูยอดรวมรายรับประจำเดือน</span>
                </div>
            </a>
        </div>

        <div class="btn-lock">
            <button onclick="logout()"><i class="fas fa-lock"></i> ล็อกหน้าจอ</button>
        </div>
        <div class="footer">K&G Property Management System v2.0</div>
    </div>

    <script>
        const SECRET_PIN = "kengandgun62"; 
        function checkAuth() {
            if (!sessionStorage.getItem("SmartDormAuth")) {
                let pin = prompt("🔒 กรุณากรอกรหัสผ่าน (K&G):");
                if (pin === SECRET_PIN) sessionStorage.setItem("SmartDormAuth", "true");
                else { alert("❌ รหัสผิด!"); window.location.href = "https://www.google.com"; }
            }
        }
        function logout() { sessionStorage.removeItem("SmartDormAuth"); location.reload(); }
        checkAuth();
    </script>
</body>
</html>
