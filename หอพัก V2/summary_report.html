<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สรุปยอด - K&G</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun'; background: #f8fafc; padding: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .table th { background: #f1f5f9; }
        .stat-box { padding: 15px; border-radius: 12px; color: white; margin-bottom: 20px; }
        .bg-blue { background: #3b82f6; } .bg-green { background: #10b981; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 no-print">
            <h3 class="fw-bold"><i class="fas fa-chart-pie"></i> รายงานสรุป</h3>
            <div>
                <input type="month" id="monthSelector" class="form-control d-inline w-auto" onchange="loadData()">
                <button class="btn btn-primary" onclick="window.print()">Print</button>
                <a href="index.html" class="btn btn-light border">กลับ</a>
            </div>
        </div>

        <div class="row text-center mb-4">
            <div class="col-md-6">
                <div class="stat-box bg-green">
                    <h3>รายรับรวม</h3>
                    <h1 class="fw-bold" id="totalIncome">0</h1>
                    <span>บาท</span>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-box bg-blue">
                    <h3>จำนวนห้องที่เก็บเงิน</h3>
                    <h1 class="fw-bold" id="totalRooms">0</h1>
                    <span>ห้อง</span>
                </div>
            </div>
        </div>

        <div class="card p-3">
            <table class="table table-hover">
                <thead><tr><th>ห้อง</th><th>น้ำ (หน่วย)</th><th>ไฟ (หน่วย)</th><th>ค่าเช่า+อื่นๆ</th><th class="text-end">รวมสุทธิ</th></tr></thead>
                <tbody id="reportTable"></tbody>
            </table>
        </div>
    </div>

<script>
    // 
    const API_URL = "https://script.google.com/macros/s/AKfycbytJyg1eNsBSj6c10DaBp8ESrihAh1ZhB__FUUMBAbCYKh2DE0mRqFjrbJcZf6ch-Q/exec"; 
    
    window.onload = function() {
        document.getElementById('monthSelector').value = new Date().toISOString().slice(0, 7);
        loadData();
    };

    function loadData() {
        const k = document.getElementById('monthSelector').value;
        if(API_URL) fetch(API_URL+"?action=load&key="+k).then(r=>r.json()).then(res=>{ if(res.status==="success"&&res.data) renderReport(JSON.parse(res.data)); });
    }

    function renderReport(data) {
        const rooms = Array.isArray(data) ? data : data.rooms||[];
        const tb = document.getElementById('reportTable'); tb.innerHTML = '';
        let grandTotal = 0, count = 0;

        rooms.forEach(r => {
            let total = (parseFloat(r.rent)||0) + (parseFloat(r.custom)||0) + (parseFloat(r.internet)||0);
            
            let wn=parseFloat(r.w_new)||0, wo=parseFloat(r.w_old)||0, wU=0;
            if(r.w_new && wn>wo) { let d=wn-wo; wU=d; if(d<4) d=4; total += d*(parseFloat(r.w_rate)||0); }
            
            let en=parseFloat(r.e_new)||0, eo=parseFloat(r.e_old)||0, eU=0;
            if(r.e_new && en>eo) { eU=en-eo; total += eU*(parseFloat(r.e_rate)||0); }

            if(r.extras) r.extras.forEach(x => total += parseFloat(x.price));

            if(total > 0) {
                grandTotal += total; count++;
                tb.innerHTML += `<tr><td>${r.id}</td><td>${wU}</td><td>${eU}</td><td>${(parseFloat(r.rent)||0).toLocaleString()}</td><td class="text-end fw-bold">${total.toLocaleString()}</td></tr>`;
            }
        });
        document.getElementById('totalIncome').innerText = grandTotal.toLocaleString();
        document.getElementById('totalRooms').innerText = count;
    }
</script>
</body>
</html>
