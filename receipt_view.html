<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พิมพ์ใบเสร็จ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f3f6f9; padding: 20px; }
        .receipt-page { width: 148mm; min-height: 209mm; background: white; padding: 10mm; margin: 0 auto 20px; page-break-after: always; position: relative; }
        .r-header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 10px; }
        .table-util, .table-sum { width: 100%; border-collapse: collapse; font-size: 14px; }
        .table-util th, .table-util td, .table-sum td { border: 1px solid #ddd; padding: 4px; }
        .text-right { text-align: right; }
        .bg-head { background: #eee; font-weight: bold; }
        .master-controls { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ccc; max-width: 800px; margin-left: auto; margin-right: auto; }
        @media print { .no-print { display: none !important; } body { background: white; padding: 0; } .receipt-page { margin: 0; box-shadow: none; } }
    </style>
</head>
<body>

    <div class="no-print">
        <div class="master-controls shadow-sm">
            <h5 class="fw-bold text-primary">🛠️ ตั้งค่าบิล (ต้นฉบับ)</h5>
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label>เลือกเดือนข้อมูล:</label>
                    <input type="month" id="monthSelector" class="form-control form-control-sm" onchange="loadData()">
                </div>
                <div class="col-md-4">
                    <label>หัวข้อรอบบิล (แก้แล้วเปลี่ยนทุกใบ):</label>
                    <input type="text" id="masterPeriod" class="form-control form-control-sm" onkeyup="updateAllReceipts()" placeholder="เช่น 1-31 มกราคม 2569">
                </div>
                <div class="col-md-3">
                    <label>เลือกพิมพ์:</label>
                    <select id="zoneSelector" class="form-select form-select-sm" onchange="renderReceipts()">
                        <option value="ALL">ทั้งหมด</option>
                        <option value="A">ตึก A</option><option value="B">ตึก B</option>
                        </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary btn-sm w-100" onclick="window.print()">พิมพ์</button>
                </div>
            </div>
            <div class="mt-2 small text-muted">* สามารถแก้ข้อความในบิลแต่ละใบแยกกันได้ (คลิกแก้ได้เลย)</div>
        </div>
        <div id="loadingMsg" class="text-center" style="display:none;">กำลังโหลด...</div>
    </div>

    <div id="receiptContainer"></div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwcFtw8FN2Zu3dte6adaFeigGpErvee8rOGYf1oZMLjMruxHdmqI2rkDVy87GH6tqs/exec";
    let currentData = [];
    const monthNames = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

    window.onload = function() {
        const now = new Date();
        document.getElementById('monthSelector').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        // Set Default Period Text
        const mStr = monthNames[now.getMonth()];
        const yStr = now.getFullYear() + 543;
        document.getElementById('masterPeriod').value = `1-31 ${mStr} ${yStr}`;
        loadData();
    };

    function loadData() {
        const k = document.getElementById('monthSelector').value;
        document.getElementById('loadingMsg').style.display = 'block';
        fetch(API_URL+"?action=load&key="+k).then(r=>r.json()).then(res=>{ 
            document.getElementById('loadingMsg').style.display = 'none';
            if(res.status==="success" && res.data) {
                currentData = (JSON.parse(res.data)).rooms || [];
                renderReceipts();
            }
        });
    }

    function renderReceipts() {
        const container = document.getElementById('receiptContainer'); container.innerHTML = '';
        const zone = document.getElementById('zoneSelector').value;
        const masterText = document.getElementById('masterPeriod').value;

        const list = (zone==='ALL') ? currentData.filter(r=>!r.isCommon) : currentData.filter(r=>!r.isCommon && r.id.startsWith(zone));

        list.forEach(r => {
            // Calc
            let rent = parseFloat(r.rent)||0, net = parseFloat(r.custom)||0, extra = parseFloat(r.extra)||0;
            let wn=parseFloat(r.w_new)||0, wo=parseFloat(r.w_old)||0, wr=parseFloat(r.w_rate)||0, wu=Math.max(0, wn-wo);
            let chargeW = (wu < 4) ? 4 : wu; let wt = chargeW * wr;
            let en=parseFloat(r.e_new)||0, eo=parseFloat(r.e_old)||0, er=parseFloat(r.e_rate)||0, eu=Math.max(0, en-eo);
            let et = eu * er;
            let total = rent + net + extra + wt + et;

            // Extra Items
            let extraHtml = '';
            if(r.extra_items && r.extra_items.length>0) {
                r.extra_items.forEach(i => extraHtml += `<tr><td>${i.name}</td><td class="text-right">${parseFloat(i.price).toLocaleString()}</td></tr>`);
            } else if(extra > 0) {
                extraHtml = `<tr><td contenteditable="true" class="text-danger">อื่นๆ</td><td class="text-right text-danger" contenteditable="true">${extra.toLocaleString()}</td></tr>`;
            }

            container.innerHTML += `
            <div class="receipt-page">
                <div class="r-header">
                    <div>
                        <h3 style="margin:0;">บิลค่าเช่า</h3>
                        <div class="period-text" contenteditable="true">ประจำเดือน: ${masterText}</div>
                    </div>
                    <div style="text-align:right; border:2px solid #000; padding:5px 15px; border-radius:8px;">
                        <small>ห้อง</small><br><b style="font-size:24px;">${r.id}</b>
                    </div>
                </div>

                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <div style="flex:1;">
                        <div class="bg-head p-1">รายการค่าน้ำ</div>
                        <table class="table-util">
                            <tr><td>จดครั้งนี้</td><td class="text-right">${wn}</td></tr>
                            <tr><td>จดครั้งก่อน</td><td class="text-right">${wo}</td></tr>
                            <tr><td>หน่วยที่ใช้ (ขั้นต่ำ 4)</td><td class="text-right">${wu}</td></tr>
                            <tr><td><b>รวม (${wr} บ./หน่วย)</b></td><td class="text-right fw-bold">${wt.toLocaleString()}</td></tr>
                        </table>
                    </div>
                    <div style="flex:1;">
                        <div class="bg-head p-1">รายการค่าไฟ</div>
                        <table class="table-util">
                            <tr><td>จดครั้งนี้</td><td class="text-right">${en}</td></tr>
                            <tr><td>จดครั้งก่อน</td><td class="text-right">${eo}</td></tr>
                            <tr><td>หน่วยที่ใช้</td><td class="text-right">${eu}</td></tr>
                            <tr><td><b>รวม (${er} บ./หน่วย)</b></td><td class="text-right fw-bold">${et.toLocaleString()}</td></tr>
                        </table>
                    </div>
                </div>

                <table class="table-sum">
                    <tr class="bg-head"><td>รายการ</td><td class="text-right" style="width:100px;">จำนวนเงิน</td></tr>
                    <tr><td>ค่าเช่าห้อง</td><td class="text-right" contenteditable="true">${rent.toLocaleString()}</td></tr>
                    ${net>0 ? `<tr><td>ค่าอินเทอร์เน็ต</td><td class="text-right" contenteditable="true">${net.toLocaleString()}</td></tr>` : ''}
                    <tr><td>ค่าน้ำประปา</td><td class="text-right">${wt.toLocaleString()}</td></tr>
                    <tr><td>ค่าไฟฟ้า</td><td class="text-right">${et.toLocaleString()}</td></tr>
                    ${extraHtml}
                    <tr style="background:#eee; font-size:18px; font-weight:bold;">
                        <td>รวมสุทธิ</td><td class="text-right" contenteditable="true">${total.toLocaleString()}</td>
                    </tr>
                </table>

                <div style="margin-top:20px; border-top:1px dashed #000; padding-top:10px; font-size:12px;" contenteditable="true">
                    <b>กำหนดชำระ:</b> ภายในวันที่ 5 ของเดือน (ล่าช้าปรับวันละ 100 บาท)<br>
                    <b>ช่องทางชำระ:</b> เงินสด / โอนเงิน
                </div>
            </div>`;
        });
    }

    function updateAllReceipts() {
        const txt = document.getElementById('masterPeriod').value;
        document.querySelectorAll('.period-text').forEach(el => el.innerText = "ประจำเดือน: " + txt);
    }
</script>
</body>
</html>
