<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานสรุปยอด - หอพัก K&G</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #0284c7; --bg: #f8fafc; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); padding: 20px; color: #334155; }
        .control-card { background: white; padding: 15px 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .stat-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; height: 100%; position: relative; overflow: hidden; }
        .stat-icon { position: absolute; right: -10px; bottom: -10px; font-size: 80px; opacity: 0.1; transform: rotate(-15deg); }
        .stat-value { font-size: 22px; font-weight: 800; color: #0f172a; margin-top: 5px; } 
        .report-table { width: 100%; font-size: 13px; border-collapse: collapse; background: white; }
        .report-table th { background: #f1f5f9; padding: 8px; text-align: center; border: 1px solid #e2e8f0; }
        .report-table td { padding: 6px 8px; border: 1px solid #e2e8f0; vertical-align: middle; }
        .row-zone-header { background: #e0f2fe; font-weight: 800; color: #0369a1; }
        .row-common-header { background: #ffedd5; font-weight: 800; color: #c2410c; }
        .col-money { text-align: right; font-weight: 600; }
        .col-total { text-align: right; font-weight: 800; color: #0f172a; background: #f8fafc; }
        @media print { .no-print { display: none !important; } .container { max-width: 100% !important; } @page { size: A4; margin: 10mm; } }
    </style>
</head>
<body>

<div class="container" style="max-width: 1200px;">
    <div class="control-card no-print">
        <div class="d-flex align-items-center gap-3">
            <h4 class="m-0 fw-bold text-primary"><i class="fas fa-chart-pie"></i> รายงานสรุปยอด</h4>
            <div class="d-flex align-items-center bg-light px-3 py-1 rounded-pill border">
                <span class="small fw-bold text-muted me-2">เดือน:</span>
                <input type="month" id="monthSelector" style="border:none; background:transparent; font-weight:bold; color:#0284c7; outline:none;" onchange="loadData()">
            </div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary rounded-pill fw-bold px-4" onclick="window.print()">พิมพ์รายงาน</button>
            <a href="index.html" class="btn btn-light border rounded-pill fw-bold">กลับ</a>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-3 col-6"><div class="stat-card border-bottom border-4 border-primary"><i class="fas fa-money-bill-wave stat-icon text-primary"></i><div>รายรับรวมสุทธิ</div><div class="stat-value text-primary" id="card_grand_total">0</div></div></div>
        <div class="col-md-3 col-6"><div class="stat-card border-bottom border-4 border-success"><i class="fas fa-home stat-icon text-success"></i><div>ค่าเช่า + เน็ต</div><div class="stat-value text-success" id="card_rent_total">0</div></div></div>
        <div class="col-md-3 col-6"><div class="stat-card border-bottom border-4 border-info"><i class="fas fa-tint stat-icon text-info"></i><div>ค่าน้ำ + ค่าไฟ</div><div class="stat-value text-info" id="card_util_total">0</div></div></div>
        <div class="col-md-3 col-6"><div class="stat-card border-bottom border-4 border-warning"><i class="fas fa-list-ul stat-icon text-warning"></i><div>อื่นๆ (จิปาถะ)</div><div class="stat-value text-warning" id="card_other_total">0</div></div></div>
    </div>

    <div class="bg-white p-4 rounded-4 shadow-sm border">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0"><i class="fas fa-list-alt"></i> รายละเอียดตามโซน</h5>
            <span class="small text-muted">ข้อมูล ณ วันที่ <span id="printDate">-</span></span>
        </div>
        <table class="report-table">
            <thead>
                <tr>
                    <th style="width:10%;">โซน/ห้อง</th>
                    <th style="width:20%;">ค่าเช่า</th>
                    <th style="width:15%;">ค่าเน็ต</th>
                    <th style="width:10%;">ค่าน้ำ</th>
                    <th style="width:10%;">ค่าไฟ</th>
                    <th style="width:10%;">อื่นๆ</th>
                    <th style="width:25%;">รวมสุทธิ</th>
                </tr>
            </thead>
            <tbody id="reportBody"></tbody>
        </table>
    </div>
</div>

<div id="loadingMsg" class="position-fixed top-50 start-50 translate-middle bg-white p-4 rounded shadow text-center" style="display:none; z-index:2000;"><i class="fas fa-spinner fa-spin fa-2x text-primary"></i></div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxBlGeRO9ayn4zrX-zQhrz6wGK1ke72tEeHMgxvpYyVDG8iozPhYvltB20YOCxQavw/exec"; 
    const STANDARD_ZONES = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P'];

    window.onload = function() {
        document.getElementById('monthSelector').value = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
        document.getElementById('printDate').innerText = new Date().toLocaleDateString('th-TH');
        loadData();
    };

    function loadData() {
        const k = document.getElementById('monthSelector').value;
        document.getElementById('loadingMsg').style.display = 'block';
        fetch(API_URL+"?action=load&key="+k).then(r=>r.json()).then(res=>{ 
            document.getElementById('loadingMsg').style.display = 'none';
            if(res.status==="success" && res.data) renderReport(JSON.parse(res.data));
            else { renderReport([]); alert("ไม่พบข้อมูล"); }
        }).catch(()=>{ document.getElementById('loadingMsg').style.display = 'none'; });
    }

    function renderReport(data) {
        const rooms = Array.isArray(data) ? data : data.rooms||[];
        const tb = document.getElementById('reportBody'); tb.innerHTML = '';
        
        let gRent=0, gNet=0, gWater=0, gElec=0, gExtra=0, gTotal=0;
        const zones = {}; const commonKey = "COMMON_AREA";

        rooms.forEach(r => {
            let zoneKey = r.isCommon ? commonKey : (STANDARD_ZONES.includes(r.id.charAt(0)) ? r.id.charAt(0) : commonKey);
            if(!zones[zoneKey]) zones[zoneKey] = [];
            zones[zoneKey].push(r);
        });

        Object.keys(zones).sort((a,b)=>(a===commonKey?1:(b===commonKey?-1:a.localeCompare(b)))).forEach(zone => {
            let title = (zone === commonKey) ? "🔹 ส่วนกลาง / อื่นๆ" : `ตึก ${zone}`;
            let cls = (zone === commonKey) ? "row-common-header" : "row-zone-header";
            tb.innerHTML += `<tr><td colspan="7" class="${cls}">${title}</td></tr>`;
            
            zones[zone].forEach(r => {
                const rent = parseFloat(r.rent)||0;
                const net = parseFloat(r.custom)||0; // custom = Net
                const extra = parseFloat(r.extra)||0; // extra = Others

                const wn=parseFloat(r.w_new)||0, wo=parseFloat(r.w_old)||0, wr=parseFloat(r.w_rate)||0;
                let wt=0; if(r.w_new && wn>=wo){ let d=wn-wo; let charge=(!r.isCommon && d<4)?4:d; wt=charge*wr; }

                const en=parseFloat(r.e_new)||0, eo=parseFloat(r.e_old)||0, er=parseFloat(r.e_rate)||0;
                let et=0; if(r.e_new && en>=eo){ et=(en-eo)*er; }

                const subTotal = rent + net + extra + wt + et;
                gRent+=rent; gNet+=net; gExtra+=extra; gWater+=wt; gElec+=et; gTotal+=subTotal;

                tb.innerHTML += `
                <tr>
                    <td class="text-center">${r.id}</td>
                    <td class="col-money text-muted">${rent.toLocaleString()}</td>
                    <td class="col-money text-muted">${net.toLocaleString()}</td>
                    <td class="col-money">${wt.toLocaleString()}</td>
                    <td class="col-money">${et.toLocaleString()}</td>
                    <td class="col-money text-danger">${extra.toLocaleString()}</td>
                    <td class="col-total">${subTotal.toLocaleString()}</td>
                </tr>`;
            });
        });

        document.getElementById('card_grand_total').innerText = gTotal.toLocaleString() + " ฿";
        document.getElementById('card_rent_total').innerText = (gRent + gNet).toLocaleString() + " ฿";
        document.getElementById('card_util_total').innerText = (gWater + gElec).toLocaleString() + " ฿";
        document.getElementById('card_other_total').innerText = gExtra.toLocaleString() + " ฿";

        tb.innerHTML += `
            <tr style="border-top: 3px double #000;">
                <td class="text-center fw-bold bg-primary text-white">รวมทั้งสิ้น</td>
                <td class="col-money fw-bold bg-light">${gRent.toLocaleString()}</td>
                <td class="col-money fw-bold bg-light">${gNet.toLocaleString()}</td>
                <td class="col-money fw-bold bg-light">${gWater.toLocaleString()}</td>
                <td class="col-money fw-bold bg-light">${gElec.toLocaleString()}</td>
                <td class="col-money fw-bold bg-light text-danger">${gExtra.toLocaleString()}</td>
                <td class="col-total bg-warning text-dark fs-5">${gTotal.toLocaleString()}</td>
            </tr>
        `;
    }
</script>
</body>
</html>
